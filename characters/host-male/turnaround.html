<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { createHostMale } from './character.js';

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 200);
const hero = createHostMale();
scene.add(hero);

// ---------- Studio (neutral reference lighting) ----------
const studio = new THREE.Group();
studio.add(new THREE.HemisphereLight(0xfff4ec, 0x6a6080, 1.4));
const key = new THREE.DirectionalLight(0xfff0e0, 2.2);
key.position.set(4, 8, 7); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 6, bottom: -1 });
studio.add(key);
const rim = new THREE.DirectionalLight(0xb48cff, 1.2);
rim.position.set(-5, 5, -6); studio.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 48),
  new THREE.MeshStandardMaterial({ color: 0xdcd8e4, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; studio.add(floor);

// ---------- Dusk window (matches the reference reel's look) ----------
const dusk = new THREE.Group();
function gradientTex() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#4b2a7a'); gr.addColorStop(0.45, '#b04f9a'); gr.addColorStop(0.75, '#e0788a'); gr.addColorStop(1, '#f2a070');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const sky = new THREE.Mesh(new THREE.PlaneGeometry(40, 30), new THREE.MeshBasicMaterial({ map: gradientTex() }));
sky.position.set(0, 4, -14); dusk.add(sky);
const dark = new THREE.MeshBasicMaterial({ color: 0x120c1c });
const lit = new THREE.MeshBasicMaterial({ color: 0xffc46b });
const cool = new THREE.MeshBasicMaterial({ color: 0x9fd8ff });
[[-6, 3.5, 3], [-2.5, 2.2, 2.2], [3.5, 4.5, 3.2], [7, 3, 2.5]].forEach(([x, h, w], i) => {
  const b = new THREE.Mesh(new THREE.PlaneGeometry(w, h * 2), dark); b.position.set(x, h - 1, -12); dusk.add(b);
  for (let k = 0; k < 6; k++) {
    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.35), (k + i) % 4 ? lit : cool);
    win.position.set(x - w / 3 + (k % 3) * w / 3, h * 1.4 - 1.2 - Math.floor(k / 3) * 0.9 - i * 0.3, -11.9);
    dusk.add(win);
  }
});
// window frame bars
const bar = (w, h, x, y) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), dark); m.position.set(x, y, -8); dusk.add(m); };
bar(30, 0.5, 0, 6.6); bar(0.5, 20, -4.2, 3); bar(0.5, 20, 5.2, 3);
dusk.add(new THREE.HemisphereLight(0xe8c8ff, 0x4a2840, 1.4));
const warm = new THREE.DirectionalLight(0xffc08a, 1.7); warm.position.set(2.5, 3, 6); dusk.add(warm);
const glow = new THREE.PointLight(0xff8a50, 3.5, 8, 1.5); glow.position.set(-1.2, 2.2, 2.5); dusk.add(glow);
const purpleRim = new THREE.DirectionalLight(0xc070ff, 1.8); purpleRim.position.set(-4, 6, -5); dusk.add(purpleRim);

scene.add(studio); scene.add(dusk);

window.renderView = ({ az = 0, el = 8, dist = 15, targetY = 2.25, mode = 'studio', fov = 28 }) => {
  studio.visible = mode === 'studio';
  dusk.visible = mode === 'dusk';
  scene.background = mode === 'studio' ? new THREE.Color(0xeeebf3) : new THREE.Color(0x1a1026);
  camera.fov = fov; camera.updateProjectionMatrix();
  const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
  camera.position.set(Math.sin(a) * Math.cos(e) * dist, targetY + Math.sin(e) * dist, Math.cos(a) * Math.cos(e) * dist);
  camera.lookAt(0, targetY, 0);
  renderer.render(scene, camera);
  return true;
};
window.ready = true;
</script>
</body>
</html>
