<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--green:#244b37;--deep:#173527;--ink:#14241e;--cream:#faf9f3;--yellow:#f0d682;--yit:#ebd17e;--olive:#5f7a45;--sage:#dfe8cf;--muted:#50685e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.layer{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.sans{font-family:'Plus Jakarta Sans',sans-serif}
.serif{font-family:'Newsreader',serif;font-optical-sizing:auto}
/* captions */
.cap{position:absolute;left:0;width:1080px;text-align:center}
.cap .ln{display:block;width:max-content;margin-left:auto;margin-right:auto;white-space:nowrap;line-height:1.02}
.cap .w{display:inline-block;will-change:transform,opacity,filter}
.cap .s{font-family:'Plus Jakarta Sans';font-weight:700;font-size:50px;letter-spacing:-0.01em;margin-top:6px;margin-bottom:6px}
.cap .B{font-family:'Newsreader';font-weight:500;font-size:138px;letter-spacing:-0.025em;margin-top:-6px;margin-bottom:2px}
.cap .B.it{font-style:italic;font-weight:500}
.dark .s{color:#fff;font-size:52px;text-shadow:0 0 22px rgba(0,0,0,.65),0 3px 10px rgba(0,0,0,.7),0 1px 2px rgba(0,0,0,.6)}
.dark .B{color:var(--cream);font-weight:600;font-size:146px;text-shadow:0 0 40px rgba(0,0,0,.65),0 6px 22px rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.55)}
.dark .B.it{font-weight:600}
.dark .B.ac{color:#f6dc8f}
.light .s{color:var(--ink)}
.light .B{color:var(--green)}
.light .B.ac{color:var(--olive)}
.green .s{color:var(--cream)}
.green .B{color:var(--cream)}
.green .B.ac{color:var(--yellow)}
.strike{position:absolute;height:12px;border-radius:6px;background:#e5533d;box-shadow:0 3px 12px rgba(0,0,0,.35);transform-origin:left center}
.kicker{font-family:'Plus Jakarta Sans';font-weight:700;font-size:25px;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
.kicker i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--yellow);margin-right:16px;vertical-align:3px}
.chip{display:flex;align-items:center;gap:16px;padding:18px 28px 18px 20px;border-radius:999px;background:var(--cream);color:var(--ink);font-family:'Plus Jakarta Sans';font-weight:700;font-size:34px;white-space:nowrap;box-shadow:0 14px 34px rgba(0,0,0,.32)}
.chip .ic{width:56px;height:56px;border-radius:50%;background:#e8f0e2;display:flex;align-items:center;justify-content:center;color:var(--green)}
.chip .ic svg{width:32px;height:32px}
.card{border-radius:20px;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.38);background:#fff}
.card img{display:block;width:100%}
.node{width:132px;height:132px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--green);box-shadow:0 0 0 8px rgba(240,214,130,.22),0 0 46px rgba(240,214,130,.45),0 16px 30px rgba(0,0,0,.35)}
.node svg{width:62px;height:62px}
.nlab{font-family:'Plus Jakarta Sans';font-weight:700;font-size:33px;color:var(--cream);text-align:center;line-height:1.12;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.paper{display:flex;align-items:center;gap:18px;padding:22px 30px;border-radius:22px;background:#fffdf6;color:var(--ink);font-family:'Plus Jakarta Sans';font-weight:800;font-size:42px;box-shadow:0 18px 40px rgba(0,0,0,.38);white-space:nowrap}
.paper svg{width:46px;height:46px;color:var(--green)}
.logochip{background:var(--cream);border-radius:26px;box-shadow:0 18px 44px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
</style></head>
<body><div id="stage">
  <div class="layer" id="back"></div>
  <div class="layer" id="behind"></div>

<script>
const Q = new URLSearchParams(location.search);
const HEADTOP = +(Q.get('headtop')||470);           // head top (canvas px) during the statement scene
const ICONS = {};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const E={
  oc:t=>1-Math.pow(1-t,3), oq:t=>1-Math.pow(1-t,5), ox:t=>t>=1?1:1-Math.pow(2,-10*t),
  ic:t=>t*t*t, ioc:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  ob:(t,s=1.7)=>{const c3=s+1;return 1+c3*Math.pow(t-1,3)+s*Math.pow(t-1,2)}
};
const P=(t,t0,d)=>clamp((t-t0)/d);
// in/out envelope -> {a: 0..1 appear progress (eased), o: 0..1 out progress}
function env(t,tin,tout,din=.32,dout=.22){return {i:P(t,tin,din), o:P(t,tout-dout,dout)}}
function el(tag,cls,parent,html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; (parent||document.getElementById('front')).appendChild(e); return e}
function set(e,{x=0,y=0,s=1,sx,sy,r=0,o=1,blur=0,rx=0,ry=0,persp=0}){
  e.style.opacity=o<=0.001?0:o.toFixed(4);
  e.style.visibility=o<=0.001?'hidden':'visible';
  let tf=''; if(persp) tf+=`perspective(${persp}px) `;
  tf+=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg)`;
  if(rx) tf+=` rotateX(${rx.toFixed(3)}deg)`; if(ry) tf+=` rotateY(${ry.toFixed(3)}deg)`;
  tf+=` scale(${(sx??s).toFixed(4)},${(sy??s).toFixed(4)})`;
  e.style.transform=tf; e.style.filter=blur>0.05?`blur(${blur.toFixed(2)}px)`:'none';
}
function icon(name,cls){return ICONS[name]||''}

/* ---------------- CAPTIONS ---------------- */
// line: [kind, [[text,t],...], flags]  kind: s | B | L(logo)   flags: it, ac
const CAPS=[
 {t0:.62,t1:1.24,th:'dark',y:1430,L:[['s',[['From the day a',.66]]],['B',[['student',.74]],'']]},
 {t0:1.24,t1:3.12,th:'dark',y:1430,L:[['s',[['joins an',1.26]]],['B',[['institution',1.34]],'it ac']]},
 {t0:3.14,t1:4.46,th:'dark',y:1430,L:[['s',[['until the',3.16],['course',3.30]]],['B',[['is complete',3.86]],'it ac']]},
 {t0:4.46,t1:5.94,th:'dark',y:1430,L:[['s',[['and they',4.50]]],['B',[['step out',4.92]],'']]},
 {t0:5.96,t1:8.14,th:'dark',y:1430,L:[['s',[['all of that',5.98],["student's",6.10]]],['B',[['information',7.04]],'it ac']]},
 {t0:8.14,t1:9.22,th:'dark',y:1430,L:[['s',[['stays in',8.20]]],['B',[['one place',8.58]],'']]},
 {t0:9.62,t1:11.10,th:'light',y:300,L:[['s',[['From the moment of',9.70]]],['B',[['admission',10.28]],'it ac']]},
 {t0:11.10,t1:12.62,th:'light',y:300,L:[['s',[['their profile is',11.12]]],['B',[['created',11.94]],'it ac']]},
 {t0:12.72,t1:18.62,th:'green',y:262,L:[['s',[['From there —',12.74]]]]},
 {t0:18.62,t1:21.36,th:'green',y:318,L:[['s',[['every',18.86],['update',19.28]]],['B',[['connects',20.76]],'it ac'],['s',[['to that',21.0],['one profile',21.12]]]]},
 {t0:21.58,t1:23.70,th:'dark',y:1430,L:[['s',[['No running to',21.62]]],['B',[['every department',22.60]],'']]},
 {t0:23.70,t1:26.62,th:'dark',y:1430,L:[['s',[['to update',23.72],['details',24.16]]],['B',[['again & again',24.82]],'it ac']],strike:{line:1,t:25.42}},
 {t0:26.72,t1:28.12,th:'dark',y:1430,L:[['s',[['Because in',26.78]]],['L',[['',27.40]]]]},
 {t0:28.30,t1:29.30,th:'light',y:300,L:[['s',[['the student',28.30]]],['B',[['journey continues',28.62]],'']]},
 {t0:29.30,t1:31.56,th:'light',y:300,L:[['s',[['in one',29.30]]],['B',[['connected system',29.40]],'it ac']]},
 {t0:32.30,t1:34.40,th:'dark',y:1430,L:[['s',[['Need a',32.66],["student's",32.88]]],['B',[['information?',33.24]],'it ac']]},
 {t0:34.40,t1:38.30,th:'dark',y:1430,L:[['s',[['No more searching through',34.46]]],['B',[['files,',35.36],['registers',35.90],['& apps',36.44]],'']],strike:{line:1,t:37.32}},
 {t0:41.72,t1:43.32,th:'dark',y:1430,L:[['s',[["And that's the power of",41.76]]],['L',[['',42.86]]]]},
];
const capEls=[];
function buildCaps(){
  for(const g of CAPS){
    const c=el('div','cap '+g.th); g.el=c; g.words=[]; g.lines=[];
    for(const [k,ws,fl] of g.L){
      const ln=el('div','ln '+(k==='L'?'Lg':k)+' '+(fl||''),c);
      g.lines.push(ln);
      if(k==='L'){ // logo chip as a "word"
        const w=el('span','w',ln); w.innerHTML=`<div class="logochip" style="padding:26px 44px;margin:18px auto 0;width:max-content"><img src="assets/logo_full.png" style="height:118px;display:block"></div>`;
        g.words.push({e:w,t:ws[0][1],k:'L'}); continue;
      }
      ws.forEach(([txt,t],i)=>{const w=el('span','w',ln); w.textContent=txt; g.words.push({e:w,t,k}); if(i<ws.length-1){ln.appendChild(document.createTextNode(' '))}});
    }
    if(g.strike){g.sEl=el('div','strike',c)}
  }
}
function fitCaps(){
  for(const g of CAPS){
    for(const ln of g.lines){ if(ln.classList.contains('Lg')) continue; const max=g.th==='dark'?990:960;
      let fs=parseFloat(getComputedStyle(ln).fontSize); let guard=0;
      while(ln.offsetWidth>max && guard++<80){fs-=2; ln.style.fontSize=fs+'px'}
    }
    const h=g.el.offsetHeight; g.el.style.top=(g.y-h/2)+'px';
  }
}
function drawCaps(t){
  for(const g of CAPS){
    const vis=t>=g.t0-0.02 && t<=g.t1+0.02; g.el.style.display=vis?'block':'none'; if(!vis) continue;
    const out=P(t,g.t1-0.2,0.2), eo=E.ic(out);
    for(const w of g.words){
      const p=P(t,w.t-0.02,w.k==='s'?0.26:0.34);
      if(w.k==='s'){const a=E.oc(p); set(w.e,{y:(1-a)*26-eo*18,o:a*(1-eo),blur:(1-a)*9+eo*8})}
      else {const a=E.ox(p); const b=E.ob(clamp(p*1.0),1.5); set(w.e,{y:(1-a)*34-eo*24,s:lerp(.72,1,b)*(1-eo*.06),o:clamp(p*2.2)*(1-eo),blur:(1-clamp(p*1.6))*12+eo*10})}
    }
    if(g.strike){const ln=g.lines[g.strike.line]; const p=E.oq(P(t,g.strike.t,0.3));
      const lr=ln.getBoundingClientRect(), cr=g.el.getBoundingClientRect();
      // only span the visible words of the line
      const ws=[...ln.querySelectorAll('.w')]; const a=ws[0].getBoundingClientRect(), b=ws[ws.length-1].getBoundingClientRect();
      const x0=a.left-cr.left-10, x1=b.right-cr.left+10, y=(a.top+a.bottom)/2-cr.top+8;
      g.sEl.style.left=x0+'px'; g.sEl.style.top=y+'px'; g.sEl.style.width=(x1-x0)+'px';
      g.sEl.style.transform=`rotate(-3deg) scaleX(${p})`; g.sEl.style.opacity=(p>0?1:0)*(1-eo);
    }
  }
}

/* ---------------- BACKGROUNDS (back layer) ---------------- */
const BK=document.getElementById('back');
function asteriskSVG(color){ // 6-arm soft asterisk like site motif
  let arms=''; for(let i=0;i<6;i++){arms+=`<rect x="-14" y="-100" width="28" height="100" rx="14" fill="${color}" transform="rotate(${i*60})"/>`}
  return `<svg viewBox="-110 -110 220 220" width="100%" height="100%"><g>${arms}</g></svg>`;
}
function grain(op){return `<svg width="1080" height="1920" style="position:absolute;inset:0;opacity:${op};mix-blend-mode:overlay"><filter id="g${op*100|0}"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g${op*100|0})"/></svg>`}
let bgCream, bgGreen, bgCream2, asts=[];
function buildBacks(){
  bgCream=el('div','abs',BK); Object.assign(bgCream.style,{width:'1080px',height:'1920px',background:'radial-gradient(1200px 900px at 80% 8%, #e7efdc 0%, rgba(231,239,220,0) 60%), radial-gradient(900px 900px at 0% 100%, #f1e6c4 0%, rgba(241,230,196,0) 55%), #faf9f3'});
  bgCream.innerHTML=grain(.35);
  bgGreen=el('div','abs',BK); Object.assign(bgGreen.style,{width:'1080px',height:'1920px',background:'radial-gradient(900px 900px at 50% 46%, #2f5f45 0%, rgba(47,95,69,0) 70%), radial-gradient(1100px 700px at 100% 0%, #1d4a35 0%, rgba(29,74,53,0) 70%), linear-gradient(180deg,#1a3a2b,#132d21)'});
  bgGreen.innerHTML=grain(.5);
  const A=[[150,260,330,'#3f7a55',.55],[930,700,420,'#4f8a5f',.35],[260,1500,380,'#3b6e4f',.45],[880,1680,260,'#5c9468',.30]];
  for(const [x,y,sz,c,o] of A){const a=el('div','abs',bgGreen); a.innerHTML=asteriskSVG(c); Object.assign(a.style,{width:sz+'px',height:sz+'px',left:(x-sz/2)+'px',top:(y-sz/2)+'px',opacity:o,filter:'blur(7px)'}); asts.push({e:a,x,y,sz,o})}
  bgCream2=el('div','abs',BK); Object.assign(bgCream2.style,{width:'1080px',height:'1920px',background:'radial-gradient(1000px 800px at 10% 5%, #e3ecd6 0%, rgba(227,236,214,0) 60%), radial-gradient(1000px 900px at 100% 95%, #f3e7bf 0%, rgba(243,231,191,0) 55%), #faf9f3'});
  bgCream2.innerHTML=grain(.35);
}
function drawBacks(t){
  // scene 3 cream: visible 9.10 -> 13.2 (covered by green wipe from 12.62)
  const c1=t>=9.10&&t<13.3; set(bgCream,{o:c1?1:0});
  // green: circle wipe from hub
  const gIn=E.ox(P(t,12.62,0.55)); const gOn=t>=12.62&&t<21.85;
  set(bgGreen,{o:gOn?1:0}); bgGreen.style.clipPath=`circle(${(gIn*2300).toFixed(1)}px at 540px 930px)`;
  asts.forEach((a,i)=>{set(a.e,{x:Math.sin(t*.35+i)*28,y:Math.cos(t*.27+i*2)*34,r:t*(i%2?7:-6)+i*20,o:a.o})});
  const c2=t>=28.10&&t<32.05; set(bgCream2,{o:c2?1:0});
}

/* ---------------- FRONT ELEMENTS ---------------- */
let shadeB, introChip, jr={}, s2=[], s3={}, s4={}, s5={}, s6={}, s7=[], s8={}, endc={}, flash;
function buildFront(){
  const F=document.getElementById('front');
  shadeB=el('div','abs'); F.insertBefore(shadeB,F.firstChild); Object.assign(shadeB.style,{width:'1080px',height:'1920px',background:'linear-gradient(to top, rgba(6,13,10,.86) 0%, rgba(6,13,10,.66) 18%, rgba(6,13,10,.38) 32%, rgba(6,13,10,0) 48%)'});

  s3.p=el('div','abs'); s3.p.innerHTML=`<div class="card" style="width:980px;border-radius:24px;box-shadow:0 30px 70px rgba(20,36,30,.28)"><img src="assets/st_welcome.png"></div>
     <div style="display:flex;gap:16px;margin-top:22px;justify-content:center">

  s4.svg=el('div','abs'); s4.svg.innerHTML=`<svg width="1080" height="1920" style="position:absolute;inset:0;overflow:visible"><g id="lines"></g><g id="pulses"></g></svg>`;
  s4.hc=[540,930]; s4.R=345;
  const NODES=[['indian-rupee','Fees',13.64],['clipboard-check','Exams',14.18],['trending-up','Academic<br>performance',14.84],['users','Parent<br>information',15.88],['bus','Transport',16.92]];
  s4.nodes=NODES.map(([ic,lab,t],i)=>{const ang=(-90+i*72)*Math.PI/180; const x=s4.hc[0]+s4.R*Math.cos(ang), y=s4.hc[1]+s4.R*Math.sin(ang);
    const n=el('div','abs node'); n.innerHTML=icon(ic); const l=el('div','abs nlab'); l.innerHTML=lab;
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line'); const dx=x-s4.hc[0], dy=y-s4.hc[1], L=Math.hypot(dx,dy);
    const x1=s4.hc[0]+dx/L*122, y1=s4.hc[1]+dy/L*122, x2=x-dx/L*76, y2=y-dy/L*76;
