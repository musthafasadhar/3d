<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter+Tight:ital,wght@0,500..900;1,500..900&display=block" rel="stylesheet">
<style>
:root{--green:#244b37;--deep:#173527;--ink:#14241e;--cream:#faf9f3;--yellow:#f0d682;--yit:#ebd17e;--olive:#5f7a45;--sage:#dfe8cf;--muted:#50685e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.layer{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.sans{font-family:'Inter Tight',sans-serif}
.serif{font-family:'Newsreader',serif;font-optical-sizing:auto}
/* captions */
.cap{position:absolute;left:0;width:1080px;text-align:center}
.cap .ln{display:block;width:max-content;margin-left:auto;margin-right:auto;white-space:nowrap;line-height:1.02}
.cap .w{display:inline-block;will-change:transform,opacity,filter}
.cap .s{font-family:'Inter Tight';font-weight:800;font-size:54px;letter-spacing:-0.025em;margin-top:4px;margin-bottom:4px}
.cap .B{font-family:'Inter Tight';font-weight:900;font-size:168px;line-height:.98;margin-top:-4px;margin-bottom:0}
.dark .s{color:#fff;text-shadow:0 0 22px rgba(0,0,0,.65),0 3px 10px rgba(0,0,0,.7),0 1px 2px rgba(0,0,0,.6)}
.green .s{color:#faf9f3;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.light .s{color:#14241e}
.dark .ln.B,.green .ln.B{filter:drop-shadow(0 10px 22px rgba(0,0,0,.55)) drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.light .ln.B{filter:drop-shadow(0 8px 16px rgba(20,36,30,.16))}
/* letter gradient system */
.lt{display:inline-block;white-space:pre;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    padding:.14em .07em .16em .07em;margin:-.14em -.115em -.16em -.07em;background-repeat:no-repeat;will-change:transform,opacity,filter}
.gt{-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding:.12em .08em;margin:-.12em -.08em;display:inline-block}
.gw{--g:linear-gradient(180deg,#ffffff 0%,#ffffff 42%,#cfd9d3 100%)}
.gg{--g:linear-gradient(180deg,#fff7dc 0%,#f8df92 38%,#e7b24c 78%,#d39a35 100%)}
.gm{--g:linear-gradient(180deg,#f2fff9 0%,#9af2cb 40%,#2cc890 80%,#14a571 100%)}
.gd{--g:linear-gradient(180deg,#2f7356 0%,#174f3b 55%,#0e4b38 100%)}
.ge{--g:linear-gradient(180deg,#2bbf86 0%,#14935f 50%,#0b6646 100%)}
.lt,.gt{background-image:linear-gradient(100deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.9) 50%,rgba(255,255,255,0) 60%),var(--g);background-size:320% 100%,100% 100%;background-position:100% 0,0 0}
.strike{position:absolute;height:12px;border-radius:6px;background:#e5533d;box-shadow:0 3px 12px rgba(0,0,0,.35);transform-origin:left center}
.kicker{font-family:'Inter Tight';font-weight:700;font-size:25px;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
.kicker i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--yellow);margin-right:16px;vertical-align:3px}
.chip{display:flex;align-items:center;gap:16px;padding:18px 28px 18px 20px;border-radius:999px;background:var(--cream);color:var(--ink);font-family:'Inter Tight';font-weight:700;font-size:34px;white-space:nowrap;box-shadow:0 14px 34px rgba(0,0,0,.32)}
.chip .ic{width:56px;height:56px;border-radius:50%;background:#e8f0e2;display:flex;align-items:center;justify-content:center;color:var(--green)}
.chip .ic svg{width:32px;height:32px}
.card{border-radius:20px;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.38);background:#fff}
.card img{display:block;width:100%}
.node{width:132px;height:132px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--green);box-shadow:0 0 0 8px rgba(240,214,130,.22),0 0 46px rgba(240,214,130,.45),0 16px 30px rgba(0,0,0,.35)}
.node svg{width:62px;height:62px}
.nlab{font-family:'Inter Tight';font-weight:700;font-size:33px;color:var(--cream);text-align:center;line-height:1.12;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.paper{display:flex;align-items:center;gap:18px;padding:22px 30px;border-radius:22px;background:#fffdf6;color:var(--ink);font-family:'Inter Tight';font-weight:800;font-size:42px;box-shadow:0 18px 40px rgba(0,0,0,.38);white-space:nowrap}
.paper svg{width:46px;height:46px;color:var(--green)}
.logochip{background:var(--cream);border-radius:26px;box-shadow:0 18px 44px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}

.dark .s{color:#fff;text-shadow:0 0 3px rgba(0,0,0,.85),0 0 14px rgba(0,0,0,.6),0 3px 10px rgba(0,0,0,.6)!important}
.dark .ln.B{filter:drop-shadow(0 0 1.6px rgba(0,0,0,.9)) drop-shadow(0 0 9px rgba(0,0,0,.5)) drop-shadow(0 8px 18px rgba(0,0,0,.45))!important}
.green .cap,.cap.green .B{font-size:128px}
.cap.green .s{font-size:46px}
.glass{display:flex;align-items:center;gap:18px;padding:18px 28px 18px 18px;border-radius:26px;background:linear-gradient(180deg,rgba(28,62,46,.92),rgba(14,36,27,.92));border:2px solid rgba(240,214,130,.38);box-shadow:0 18px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);color:#faf9f3;font-family:'Inter Tight';font-weight:800;font-size:34px;white-space:nowrap}
.glass .gi{width:58px;height:58px;border-radius:16px;background:linear-gradient(180deg,#f8df92,#e2b04a);display:flex;align-items:center;justify-content:center;color:#14241e;flex:none}
.glass .gi svg{width:34px;height:34px}
.glass small{display:block;font-weight:600;font-size:24px;color:rgba(250,249,243,.72);margin-top:2px}
.dnode{width:150px;height:150px;border-radius:38px;background:linear-gradient(180deg,rgba(32,70,52,.95),rgba(16,40,30,.95));border:2px solid rgba(240,214,130,.45);display:flex;align-items:center;justify-content:center;color:#f6dc8f;box-shadow:0 0 40px rgba(240,214,130,.25),0 18px 36px rgba(0,0,0,.4)}
.dnode svg{width:74px;height:74px}
.rec{font-family:'Inter Tight';font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);white-space:nowrap}
</style></head>
<body><div id="stage">
  <div class="layer" id="back"></div>
  <div class="layer" id="behind"></div>
  <div class="layer" id="front"></div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const HEADTOP = +(Q.get('headtop')||470);           // head top (canvas px) during the statement scene
const ICONS = {};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const E={
  oc:t=>1-Math.pow(1-t,3), oq:t=>1-Math.pow(1-t,5), ox:t=>t>=1?1:1-Math.pow(2,-10*t),
  ic:t=>t*t*t, ioc:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  ob:(t,s=1.7)=>{const c3=s+1;return 1+c3*Math.pow(t-1,3)+s*Math.pow(t-1,2)}
};
const P=(t,t0,d)=>clamp((t-t0)/d);
// in/out envelope -> {a: 0..1 appear progress (eased), o: 0..1 out progress}
function env(t,tin,tout,din=.32,dout=.22){return {i:P(t,tin,din), o:P(t,tout-dout,dout)}}
function el(tag,cls,parent,html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; (parent||document.getElementById('front')).appendChild(e); return e}
function set(e,{x=0,y=0,s=1,sx,sy,r=0,o=1,blur=0,rx=0,ry=0,persp=0}){
  e.style.opacity=o<=0.001?0:o.toFixed(4);
  e.style.visibility=o<=0.001?'hidden':'visible';
  let tf=''; if(persp) tf+=`perspective(${persp}px) `;
  tf+=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg)`;
  if(rx) tf+=` rotateX(${rx.toFixed(3)}deg)`; if(ry) tf+=` rotateY(${ry.toFixed(3)}deg)`;
  tf+=` scale(${(sx??s).toFixed(4)},${(sy??s).toFixed(4)})`;
  e.style.transform=tf; const fx=e.dataset.fx||''; e.style.filter=((blur>0.05?`blur(${blur.toFixed(2)}px) `:'')+fx)||'none';
}
function icon(name,cls){return ICONS[name]||''}

/* ---------------- CAPTIONS ---------------- */
// line: [kind, [[text,t],...], flags]  kind: s | B | L(logo)   flags: it, ac
const CAPS=[
 {t0:.04,t1:2.04,th:'dark',y:1470,L:[['s',[['Different',.06]]],['B',[['departments',1.18]],'gw']]},
 {t0:2.04,t1:3.92,th:'dark',y:1470,L:[['s',[['work',2.10]]],['B',[['separately',2.62]],'gm'],['s',[['in a school',3.32]]]]},
 {t0:3.94,t1:6.34,th:'dark',y:1470,L:[['s',[['But why should the',3.96]]],['B',[['information',4.22]],'gg'],['s',[['also be separate?',4.66]]]]},
 {t0:6.55,t1:9.50,th:'green',y:190,L:[['s',[['If the',6.60]]],['B',[['admissions',6.80]],'gg'],['s',[['department adds a student,',8.22]]]]},
 {t0:9.50,t1:12.15,th:'green',y:190,L:[['s',[['then the',9.52]]],['B',[['academic team',9.62]],'gm'],['s',[['works with the same student.',10.32]]]]},
 {t0:12.15,t1:15.85,th:'green',y:190,L:[['s',[['The',12.20]]],['B',[['accounts team',12.40]],'gg'],['s',[['maintains the fee structure.',13.20]]]]},
 {t0:15.85,t1:17.98,th:'green',y:190,L:[['s',[['The',15.90]]],['B',[['transport team',16.12]],'gm'],['s',[['assigns the route.',17.06]]]]},
 {t0:18.30,t1:22.05,th:'dark',y:1470,L:[['s',[['Usually,',18.30],['every',19.48]]],['B',[['department',19.88]],'gw'],['s',[['keeps its own data.',20.48]]]]},
 {t0:22.24,t1:24.22,th:'dark',y:1470,L:[['s',[['But in',22.26]]],['L',[['',23.22]]]]},
 {t0:24.22,t1:25.84,th:'dark',y:1470,L:[['s',[['even if departments',24.30]]],['B',[['work separately,',24.78]],'gm']]},
 {t0:26.30,t1:29.08,th:'green',y:250,L:[['s',[['student details stay',26.34]]],['B',[['connected',27.72]],'gg'],['s',[['in one system.',28.08]]]]},
 {t0:29.60,t1:31.44,th:'dark',y:1470,L:[['s',[['No need to enter',30.34]]],['B',[['the same work',30.92]],'gw']]},
 {t0:31.44,t1:33.92,th:'dark',y:1470,L:[['B',[['again & again',31.48]],'gg']],strike:{line:0,t:32.40}},
 {t0:33.96,t1:36.30,th:'dark',y:1470,L:[['s',[['So what if',34.02]]],['B',[['departments',34.24]],'gw'],['s',[['work separately?',34.70]]]]},
 {t0:36.32,t1:38.66,th:'dark',y:1470,L:[['s',[['All the details are in one',36.38]]],['B',[['connected system.',37.52]],'gg']]},
 {t0:38.72,t1:40.92,th:'dark',y:1470,L:[['s',[["And that's one of the",39.08]]],['B',[['biggest ideas',40.16]],'gg']]},
 {t0:40.92,t1:42.28,th:'dark',y:1470,L:[['s',[['behind',40.94]]],['L',[['',41.18]]]]},
 {t0:42.32,t1:45.30,th:'dark',y:1470,L:[['s',[['Want to know more about',42.40]]],['B',[['Taara ERP?',43.22]],'gm']]},
 {t0:45.30,t1:48.36,th:'dark',y:1470,L:[['B',[['Comment below',45.38]],'gg'],['s',[["We'll contact you.",46.78]]]]},
];
const capEls=[];
function makeLetters(parent,txt,cls){ const L=[]; [...txt].forEach((ch,j)=>{const sp=el('span','lt '+cls,parent); sp.textContent=ch; if(ch===' ') sp.style.marginRight='.025em'; L.push({e:sp,j,rot:((j*37)%11-5)*1.6})}); return L }
// letter-by-letter pop with gradient shine
function animLetters(L,t0,t,{dur=.36,stag=null,amp=1}={}){
  const n=L.length; const st=stag??Math.min(.035,.26/Math.max(1,n));
  for(const l of L){ const p=P(t,t0+l.j*st,dur); const a=E.ob(p,1.9), b=E.ox(p);
    set(l.e,{y:(1-b)*80*amp,s:lerp(.35,1,a),r:(1-E.oc(p))*l.rot*amp,o:clamp(p*3.2),blur:(1-clamp(p*2.2))*9});
    const sp=(t-(t0+.32+st*n)-l.j*.028)/.42; // shine sweep after build
    l.e.style.backgroundPosition=`${(100-clamp(sp)*100).toFixed(1)}% 0, 0 0`;
  } }
function buildCaps(){
  for(const g of CAPS){
    const c=el('div','cap '+g.th); g.el=c; g.words=[]; g.lines=[];
    for(const [k,ws,fl] of g.L){
      const ln=el('div','ln '+(k==='L'?'Lg':k)+' '+(fl||''),c);
      g.lines.push(ln);
      if(k==='L'){ // logo chip as a "word"
        const w=el('span','w',ln); w.innerHTML=`<div class="logochip" style="padding:26px 44px;margin:18px auto 0;width:max-content"><img src="assets/logo_full.png" style="height:118px;display:block"></div>`;
        g.words.push({e:w,t:ws[0][1],k:'L'}); continue;
      }
      ws.forEach(([txt,t],i)=>{const w=el('span','w',ln);
        if(k==='B'){ const L=makeLetters(w,txt+(i<ws.length-1?' ':''),fl||'gw'); g.words.push({e:w,t,k,L}); }
        else { w.textContent=txt; g.words.push({e:w,t,k}); if(i<ws.length-1){ln.appendChild(document.createTextNode(' '))} } });
    }
    if(g.strike){g.sEl=el('div','strike',c)}
  }
}
function fitCaps(){
  for(const g of CAPS){
    for(const ln of g.lines){ if(ln.classList.contains('Lg')) continue; const max=g.th==='dark'?1000:980;
      let fs=parseFloat(getComputedStyle(ln).fontSize); let guard=0;
      while(ln.getBoundingClientRect().width>max && guard++<120){fs-=2; ln.style.fontSize=fs+'px'}
    }
    const h=g.el.offsetHeight; g.el.style.top=(g.y-h/2)+'px';
  }
}
function drawCaps(t){
  for(const g of CAPS){
    const vis=t>=g.t0-0.02 && t<=g.t1+0.02; g.el.style.display=vis?'block':'none'; if(!vis) continue;
    const out=P(t,g.t1-0.2,0.2), eo=E.ic(out);
    for(const w of g.words){
      const p=P(t,w.t-0.02,w.k==='s'?0.26:0.34);
      if(w.k==='s'){const a=E.oc(p); set(w.e,{y:(1-a)*26-eo*18,o:a*(1-eo),blur:(1-a)*9+eo*8})}
      else if(w.k==='B'){ const hit=Math.exp(-7*Math.max(0,t-w.t-.12))*(t>w.t+.12?1:0); // little settle punch
        set(w.e,{y:-eo*30,s:(1+.05*hit*Math.sin(Math.min(1,(t-w.t-.12)/.18)*Math.PI))*(1-eo*.08),o:(t>=w.t-0.03?1:0)*(1-eo),blur:eo*12});
        animLetters(w.L,w.t-0.02,t) }
      else {const a=E.ox(p); const b=E.ob(clamp(p*1.0),1.5); set(w.e,{y:(1-a)*34-eo*24,s:lerp(.6,1,b)*(1-eo*.06),o:clamp(p*2.2)*(1-eo),blur:(1-clamp(p*1.6))*12+eo*10})}
    }
    if(g.strike){const ln=g.lines[g.strike.line]; const p=E.oq(P(t,g.strike.t,0.3));
      const lr=ln.getBoundingClientRect(), cr=g.el.getBoundingClientRect();
      // only span the visible words of the line
      const ws=[...ln.querySelectorAll('.w')]; const a=ws[0].getBoundingClientRect(), b=ws[ws.length-1].getBoundingClientRect();
      const x0=a.left-cr.left-10, x1=b.right-cr.left+10, y=(a.top+a.bottom)/2-cr.top+8;
      g.sEl.style.left=x0+'px'; g.sEl.style.top=y+'px'; g.sEl.style.width=(x1-x0)+'px';
      g.sEl.style.transform=`rotate(-3deg) scaleX(${p})`; g.sEl.style.opacity=(p>0?1:0)*(1-eo);
    }
  }
}

/* ---------------- BACKGROUNDS ---------------- */
const BK=document.getElementById('back');
function asteriskSVG(color){ // 6-arm soft asterisk like site motif
  let arms=''; for(let i=0;i<6;i++){arms+=`<rect x="-14" y="-100" width="28" height="100" rx="14" fill="${color}" transform="rotate(${i*60})"/>`}
  return `<svg viewBox="-110 -110 220 220" width="100%" height="100%"><g>${arms}</g></svg>`;
}
function grain(op){return `<svg width="1080" height="1920" style="position:absolute;inset:0;opacity:${op};mix-blend-mode:overlay"><filter id="g${op*100|0}"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g${op*100|0})"/></svg>`}
let bgGreen, asts=[];
function buildBacks(){
  bgGreen=el('div','abs',BK); Object.assign(bgGreen.style,{width:'1080px',height:'1920px',background:'radial-gradient(900px 900px at 50% 40%, #2f5f45 0%, rgba(47,95,69,0) 70%), radial-gradient(1100px 700px at 100% 0%, #1d4a35 0%, rgba(29,74,53,0) 70%), linear-gradient(180deg,#1a3a2b,#132d21)'});
  bgGreen.innerHTML=grain(.5);
  const A=[[150,240,330,'#3f7a55',.5],[950,640,420,'#4f8a5f',.32],[120,1340,380,'#3b6e4f',.4],[960,1720,260,'#5c9468',.28]];
  for(const [x,y,sz,c,o] of A){const a=el('div','abs',bgGreen); a.innerHTML=asteriskSVG(c); Object.assign(a.style,{width:sz+'px',height:sz+'px',left:(x-sz/2)+'px',top:(y-sz/2)+'px',opacity:o,filter:'blur(7px)'}); asts.push({e:a,x,y,sz,o})}
}
const BACKWIN=[[6.38,18.50],[25.86,29.62]];
function drawBacks(t){
  const on=BACKWIN.some(([a,b])=>t>=a&&t<b); set(bgGreen,{o:on?1:0});
  asts.forEach((a,i)=>{set(a.e,{x:Math.sin(t*.35+i)*28,y:Math.cos(t*.27+i*2)*34,r:t*(i%2?7:-6)+i*20,o:a.o})});
}

let shadeB, introChip, rec={}, deck=[], dcount, pills=[], hub={}, rep={}, bw=[], cmt={}, endc={};
const SPLIT_TOP=820;
function glassHTML(ic,title,sub){return `<span class="gi">${icon(ic)}</span><span>${title}${sub?`<small>${sub}</small>`:''}</span>`}
function buildFront(){
  const F=document.getElementById('front');
  shadeB=el('div','abs'); F.insertBefore(shadeB,F.firstChild); Object.assign(shadeB.style,{width:'1080px',height:'1920px',background:'linear-gradient(to top, rgba(6,13,10,.50) 0%, rgba(6,13,10,.32) 15%, rgba(6,13,10,.14) 28%, rgba(6,13,10,0) 40%)'});
  introChip=el('div','abs logochip'); introChip.innerHTML='<img src="assets/logo_full.png" style="height:64px;display:block">'; Object.assign(introChip.style,{padding:'20px 32px'});
  // REC viewfinder (ref style)
  rec.w=el('div','abs'); Object.assign(rec.w.style,{width:'1080px',height:'1920px'});
  const br=(x,y,sx,sy)=>`<path d="M ${x} ${y+sy*70} L ${x} ${y} L ${x+sx*70} ${y}" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
  rec.w.innerHTML=`<svg width="1080" height="1920" style="position:absolute;inset:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.55))">${br(46,46,1,1)}${br(1034,46,-1,1)}${br(46,1874,1,-1)}${br(1034,1874,-1,-1)}</svg>`;
  rec.dot=el('div','abs',rec.w); Object.assign(rec.dot.style,{width:'26px',height:'26px',borderRadius:'50%',background:'#ff3b30',left:'84px',top:'86px',boxShadow:'0 0 14px rgba(255,59,48,.8)'});
  rec.t=el('div','abs rec',rec.w,'REC'); Object.assign(rec.t.style,{left:'124px',top:'78px',fontSize:'36px',letterSpacing:'.06em'});
  rec.tc=el('div','abs rec',rec.w,'00:00:00'); Object.assign(rec.tc.style,{right:'84px',left:'auto',top:'80px',fontSize:'32px',fontWeight:700,letterSpacing:'.04em',fontVariantNumeric:'tabular-nums'});
  // department deck (real Taara ERP screens)
