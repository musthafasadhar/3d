<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>B-roll renderer</title>
<style>
@font-face { font-family: Bebas; src: url(fonts/bebas.woff2); }
@font-face { font-family: Oswald; src: url(fonts/oswald-400.woff2); font-weight: 400; }
@font-face { font-family: Oswald; src: url(fonts/oswald-700.woff2); font-weight: 700; }
@font-face { font-family: Elite; src: url(fonts/elite.woff2); }
@font-face { font-family: Plex; src: url(fonts/plex-400.woff2); font-weight: 400; }
@font-face { font-family: Plex; src: url(fonts/plex-700.woff2); font-weight: 700; }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="vendor/world.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function renderFrame(id, f) {
  const sc = SCENES[id];
  const t = f / FPS;
  const S = { glitch: f < 8 ? (1 - f / 8) * 0.7 : 0, shake: 0, tag: sc.tag };
  // draw scene into a camera transform (slow push-in + optional shake)
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // run the scene once to collect S.shake, then draw with it
  const zoom = 1 + 0.045 * (t / sc.dur);
  ctx.translate(W / 2, H / 2); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);
  const probe = { ...S };
  ctx.save(); sc.draw(ctx, t, f, probe); ctx.restore();
  if (probe.shake) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    const sx = (hash(f * 1.1) - 0.5) * 2 * probe.shake, sy = (hash(f * 2.3) - 0.5) * 2 * probe.shake;
    ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(zoom * 1.02, zoom * 1.02); ctx.translate(-W / 2, -H / 2);
    ctx.save(); sc.draw(ctx, t, f, { ...S }); ctx.restore();
  }
  ctx.restore();
  S.glitch = Math.max(S.glitch, probe.glitch);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  post(ctx, f, S);
}
function frameJPEG(id, f) { renderFrame(id, f); return canvas.toDataURL('image/jpeg', 0.96).split(',')[1]; }

window.SCENE_LIST = Object.keys(SCENES).map(id => ({ id, dur: SCENES[id].dur }));
(async () => {
  await Promise.all(['Bebas', 'Elite', 'Oswald', 'Plex'].map(n => document.fonts.load(`40px ${n}`)));
  await document.fonts.load('700 40px Plex'); await document.fonts.load('700 40px Oswald');
  initMaps(); initPost();
  landDots('world', worldProj(), 11);
  window.READY = true;
})();
</script>
</body>
</html>
