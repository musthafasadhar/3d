<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
<script type="importmap">{ "imports": {
  "three": "/characters/node_modules/three/build/three.module.js",
  "three/addons/": "/characters/node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { buildCabin } from './cabin.js';
import { createHostMale } from '/characters/host-male/character.js';
import { createDoctor } from '/characters/doctor/character.js';
import { createAvniBuddy } from '/characters/avni-buddy/character.js';

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x120d0b);
scene.fog = new THREE.Fog(0x2a1d16, 22, 40);
scene.add(buildCabin());
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 80);

const kiran = createHostMale(); scene.add(kiran);
const doctor = createDoctor(); scene.add(doctor);
const avni = createAvniBuddy(); scene.add(avni);

// ---------- post: DOF -> bloom -> tonemap -> grade ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 8, aperture: 0.0035, maxblur: 0.012 });
composer.addPass(bokeh);
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.45, 0.55, 0.82));
composer.addPass(new OutputPass());
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uVig: { value: 0.38 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform float uVig; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + uTime*7.13) * 43758.5453); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      float l = dot(c, vec3(0.299,0.587,0.114));
      // split-tone: teal shadows, warm highlights
      c += vec3(-0.035, 0.012, 0.045) * (1.0 - smoothstep(0.0, 0.5, l));
      c += vec3(0.05, 0.018, -0.03) * smoothstep(0.45, 1.0, l);
      // gentle S-curve contrast + saturation
      c = mix(c, c*c*(3.0-2.0*c), 0.28);
      c = mix(vec3(l), c, 1.1);
      // lifted blacks (filmic)
      c = c * 0.96 + 0.025;
      // vignette
      vec2 d = vUv - 0.5; d.x *= 0.62;
      c *= 1.0 - uVig * smoothstep(0.18, 0.75, length(d));
      // fine grain
      c += (h(vUv * 1000.0) - 0.5) * 0.028;
      gl_FragColor = vec4(c, 1.0);
    }` });
composer.addPass(grade);

function place(o, x, y, z, ry = 0) { o.position.set(x, y, z); o.rotation.set(0, ry, 0); o.visible = true; }
function shot(cam, target, fov, focusOn, aperture = 0.0035) {
  camera.fov = fov; camera.updateProjectionMatrix();
  camera.position.set(...cam); camera.lookAt(...target);
  bokeh.uniforms.focus.value = camera.position.distanceTo(new THREE.Vector3(...focusOn));
  bokeh.uniforms.aperture.value = aperture;
}

// Staging: doctor seated behind the desk (facing +z), Kiran in the patient chair at the desk's
// right side (facing -x, turned toward the doctor), Avni standing on the desk.
const KIRAN_RY = -Math.PI / 2 - 0.35;
function stage() {
  place(doctor, 0.4, -0.2, -2.6);
  place(kiran, 3.8, 0.12, -0.5, KIRAN_RY);
  place(avni, -1.0, 1.28, 0.2, 0.35);
  avni.setEyes('neutral');
  for (const c of [kiran, doctor]) c.getObjectByName('head').rotation.set(0, 0, 0);
}
const frontWall = () => scene.getObjectByName('frontWall');
const SHOTS = {
  // --- cast portraits (front wall hidden so the camera can pull back) ---
  cast_kiran() {
    stage(); avni.visible = false; doctor.visible = false; frontWall().visible = false;
    place(kiran, 1.6, 0, 3.2, -0.25);
    shot([0.3, 3.0, 13.5], [1.4, 2.25, 3.2], 26, [1.6, 3.0, 3.6], 0.0016);
  },
  cast_doctor() {
    stage(); avni.visible = false; kiran.visible = false; frontWall().visible = false;
    place(doctor, 1.6, 0, 3.2, -0.25);
    shot([0.3, 3.0, 13.5], [1.4, 2.25, 3.2], 26, [1.6, 3.0, 3.6], 0.0016);
  },
  cast_avni() {
    stage(); kiran.visible = false; doctor.visible = false; avni.setEyes('neutral'); frontWall().visible = true;
    place(avni, 1.4, 1.28, 0.3, 0.1);
    shot([1.2, 2.05, 5.3], [1.4, 1.8, 0.3], 26, [1.4, 1.8, 0.75], 0.004);
  },
  // --- scene shots ---
  wide() {
    stage(); avni.visible = false; frontWall().visible = false;
    shot([8.5, 6.2, 10.5], [0.8, 2.0, -1.3], 40, [2.0, 2.6, -1.0], 0.0008);
  },
  kiran_cu() {
    stage(); avni.visible = false; frontWall().visible = true; kiran.getObjectByName('head').rotation.set(0.04, -0.2, 0);
    shot([-4.1, 3.3, 1.2], [3.8, 2.75, -0.5], 30, [3.8, 3.4, -0.5], 0.0035);
  },
  doctor_cu() {
    stage(); avni.visible = false; frontWall().visible = true; doctor.getObjectByName('head').rotation.set(0.04, 0.35, 0);
    shot([4.3, 3.3, 4.9], [0.4, 2.65, -2.6], 30, [0.4, 3.1, -1.7], 0.0035);
  },
};

window.renderShot = (id) => {
  for (const o of [kiran, doctor, avni]) o.traverse(() => {});
  SHOTS[id]();
  grade.uniforms.uTime.value = 1.0;
  composer.render();
  return true;
};
window.ready = true;
</script>
</body>
</html>
