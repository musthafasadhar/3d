<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"PJS";src:url("../fonts/PJS.ttf");font-weight:200 800}
@font-face{font-family:"Inter";src:url("../fonts/Inter.ttf");font-weight:100 900}
@font-face{font-family:"Fra";src:url("../fonts/Fraunces.ttf");font-weight:100 900}
:root{--g0:#0A2E22;--g1:#0E3B2A;--g2:#14503A;--g3:#1F7A55;--mint:#1E9A6A;--cream:#F7F5EF;--gold:#E9C36B;--ink:#12281F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
#root{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;font-family:"PJS",sans-serif;color:#fff;background:#000}
.abs{position:absolute}.hide{display:none!important}
#scenes,#over,#cards,#fx{position:absolute;left:0;top:0;width:1080px;height:1920px}
#spk{position:absolute;overflow:hidden;background:#000;will-change:transform}
#spk img{position:absolute;display:block;max-width:none;image-rendering:auto}
#ring{position:absolute;border-radius:50%;pointer-events:none}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.bgL{position:absolute;inset:0;background:radial-gradient(1000px 760px at 88% -4%,#E4EBD2 0%,rgba(228,235,210,0) 62%),radial-gradient(900px 760px at -6% 104%,#F2E6C4 0%,rgba(242,230,196,0) 62%),linear-gradient(180deg,#F5F5EA 0%,#F7F5EF 55%,#F6F1E2 100%)}
.bgD{position:absolute;inset:0;background:radial-gradient(980px 1080px at 50% 30%,#226B4A 0%,#17503A 46%,#0E3326 100%)}
.ast{position:absolute;width:0;height:0}
.ast i{position:absolute;left:-36px;top:-210px;width:72px;height:420px;border-radius:36px;background:currentColor;transform-origin:50% 50%;display:block}
.ast i:nth-child(2){transform:rotate(60deg)}.ast i:nth-child(3){transform:rotate(120deg)}
.eyebrow{position:absolute;left:0;width:1080px;text-align:center;font-family:"Inter";font-weight:800;font-size:27px;letter-spacing:.30em;text-transform:uppercase;white-space:nowrap}
.eyebrow b{display:inline-block;width:11px;height:11px;border-radius:6px;background:var(--gold);margin-right:16px;vertical-align:2px;letter-spacing:0}
.card{position:absolute;left:0;top:0;width:1080px;height:1920px}
.cw{position:absolute;white-space:nowrap;display:inline-block;transform-origin:50% 60%}
.pre,.post{font-weight:800;letter-spacing:-.025em;line-height:1}
.key{font-weight:800;letter-spacing:-.055em;line-height:1;-webkit-background-clip:text;background-clip:text;color:transparent}
.k-gold{background-image:linear-gradient(180deg,#FFF3C4 0%,#F4D27A 36%,#DCA63F 70%,#B77F1E 100%);filter:drop-shadow(0 5px 10px rgba(40,20,0,.55)) drop-shadow(0 1px 1px rgba(60,30,0,.6))}
.k-green{background-image:linear-gradient(180deg,#25A674 0%,#0E7A57 42%,#0F3F2E 100%);filter:drop-shadow(0 6px 14px rgba(15,60,42,.18))}
.k-white{background-image:linear-gradient(180deg,#FFFFFF 0%,#F2F0E6 55%,#CFCBB8 100%);filter:drop-shadow(0 6px 16px rgba(0,0,0,.45))}
.k-spk{background-image:linear-gradient(180deg,#FFE9A0 0%,#F0C25A 40%,#D49A2E 75%,#A9701A 100%);filter:drop-shadow(2px 0 0 #4a2a06) drop-shadow(-2px 0 0 #4a2a06) drop-shadow(0 2px 0 #4a2a06) drop-shadow(0 -2px 0 #4a2a06) drop-shadow(0 9px 14px rgba(30,14,0,.5))}
.c-spk{color:#fff;text-shadow:0 0 4px rgba(20,10,0,.95),0 0 10px rgba(20,10,0,.7),0 3px 12px rgba(20,10,0,.7)}
.c-light{color:var(--ink)}.c-dark{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.ui{position:absolute;color:#14301F;background:#fff;border-radius:26px;box-shadow:0 26px 70px rgba(26,60,42,.17),0 2px 0 rgba(255,255,255,.9) inset,0 0 0 1px rgba(20,60,40,.05)}
.ser{font-family:"Fra",serif;font-weight:600;letter-spacing:-.01em}
.lab{font-family:"Inter";font-weight:600;color:#6b7a70}
.pill{position:absolute;display:flex;align-items:center;gap:14px;white-space:nowrap;background:#fff;border-radius:999px;font-family:"Inter";font-weight:700;color:#14301F;box-shadow:0 14px 38px rgba(0,0,0,.20),0 0 0 1px rgba(0,0,0,.04)}
.ibox{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#E8F1E8;flex:none}
</style></head>
<body><div id="root">
  <div id="scenes"></div>
  <div id="spk"><img id="spkimg" src=""></div>
  <div id="ring"></div>
  <div id="over"></div>
  <div id="cards"></div>
  <div id="fx"></div>
</div>
<script src="core.js"></script><script src="icons.js"></script><script src="speaker.js"></script><script src="captions2.js"></script>
<script src="scenesL.js"></script><script src="scenesD.js"></script><script src="overlays2.js"></script><script src="main2.js"></script>
</body></html>
