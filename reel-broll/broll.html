<!doctype html>
<html><head><meta charset="utf-8"><title>Reel B-roll</title>
<style>html,body{margin:0;background:#f6faf2}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, CX = W / 2;
let BA = 1;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const FONT = '"Inter Display", "Inter", sans-serif';
let AVATAR = null;
window.setAvatar = (src) => new Promise(r => { const i = new Image(); i.onload = () => { AVATAR = i; r(); }; i.src = src; });

// ---------- math ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = t => 1 - Math.pow(1 - t, 3);
const eInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const eExpo = t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
function spring(t, f = 7, d = 5) { if (t <= 0) return 0; return 1 - Math.exp(-d * t) * Math.cos(f * t * Math.PI * .5); }
function rand(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

// ---------- primitives ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function shadow(blur = 60, oy = 30, a = .16, col = '40,80,20') { ctx.shadowColor = `rgba(${col},${a})`; ctx.shadowBlur = blur; ctx.shadowOffsetY = oy; ctx.shadowOffsetX = 0; }
function noShadow() { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }

// clay card: soft white extruded slab
function clay(x, y, w, h, r, opt = {}) {
  const depth = opt.depth ?? 14;
  const top = opt.top ?? '#ffffff', bot = opt.bot ?? '#eef2ec', side = opt.side ?? '#d9dfd5';
  ctx.save();
  shadow(opt.blur ?? 70, opt.oy ?? 40, opt.sa ?? .18);
  rr(x, y + depth, w, h, r); ctx.fillStyle = side; ctx.fill();
  noShadow();
  rr(x, y, w, h, r);
  const g = ctx.createLinearGradient(x, y, x, y + h); g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fill();
  // rim light
  ctx.save(); rr(x, y, w, h, r); ctx.clip();
  const rg = ctx.createLinearGradient(x, y, x, y + 40); rg.addColorStop(0, 'rgba(255,255,255,.95)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.strokeStyle = rg; ctx.lineWidth = 6; rr(x + 2, y + 2, w - 4, h - 4, r); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

// skeleton line
function bar(x, y, w, h, col = 'rgba(60,80,55,.12)') { rr(x, y, Math.max(h, w), h, h / 2); ctx.fillStyle = col; ctx.fill(); }

// ---------- background ----------
const grid = document.createElement('canvas'); grid.width = W; grid.height = H;
(function buildGrid() {
  const g = grid.getContext('2d');
  const s = 120, x0 = 60, y0 = 360, cols = 9, rows = 10;
  g.strokeStyle = 'rgba(96,170,60,.30)'; g.lineWidth = 2;
  for (let i = 0; i <= cols; i++) { g.beginPath(); g.moveTo(x0 + i * s, y0 - 40); g.lineTo(x0 + i * s, y0 + rows * s + 40); g.stroke(); }
  for (let j = 0; j <= rows; j++) { g.beginPath(); g.moveTo(x0 - 40, y0 + j * s); g.lineTo(x0 + cols * s + 40, y0 + j * s); g.stroke(); }
  g.fillStyle = 'rgba(96,170,60,.55)';
  for (let i = 0; i <= cols; i++) for (let j = 0; j <= rows; j++) if ((i + j) % 2 === 0) { g.beginPath(); g.arc(x0 + i * s, y0 + j * s, 4, 0, 7); g.fill(); }
  g.globalCompositeOperation = 'destination-in';
  const m = g.createRadialGradient(W / 2, H / 2, 80, W / 2, H / 2, 640);
  m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(.7, 'rgba(0,0,0,.6)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = m; g.fillRect(0, 0, W, H);
})();

function blob(pts, tip, tcol) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i += 3) ctx.bezierCurveTo(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], pts[i + 2][0], pts[i + 2][1]);
  ctx.closePath();
  const g = ctx.createLinearGradient(tip[0], tip[1], tip[2], tip[3]);
  g.addColorStop(0, tcol); g.addColorStop(.55, 'rgba(150,210,110,.35)'); g.addColorStop(1, 'rgba(240,248,234,0)');
  ctx.fillStyle = g; ctx.fill();
}

function background(t) {
  ctx.fillStyle = '#f5f9f1'; ctx.fillRect(0, 0, W, H);
  const a = Math.sin(t * .35) * 30, b = Math.cos(t * .27) * 26;
  ctx.save();
  ctx.filter = 'blur(6px)';
  // top-left sweeping blade
  blob([[-60, -60], [300 + a, -60], [420 + b, 120], [690 + a, 430], [430, 330 + b], [180, 330], [-60, 760 + a], [-60, 400], [-60, 0], [-60, -60]], [640 + a, 420, 120, 140], 'rgba(92,178,44,.95)');
  // pale inner lobe
  blob([[-60, 820], [60, 520 + b], [220, 350], [520, 360 + a], [360, 380], [120, 600], [-60, 1100], [-60, 1000], [-60, 900], [-60, 820]], [500, 360, 0, 900], 'rgba(150,210,110,.55)');
  // bottom-right blade
  blob([[W + 60, H + 60], [760 - a, H + 60], [700, 1500 + b], [720 + a, 1330], [800, 1520], [900, 1620 - b], [W + 60, 1640], [W + 60, 1800], [W + 60, H], [W + 60, H + 60]], [720 + a, 1340, 980, 1900], 'rgba(92,178,44,.95)');
  blob([[W + 60, 1700], [760, 1680 + a], [740, 1420], [W + 60, 1100 + b], [W + 60, 1300], [W + 60, 1500], [W + 60, 1600], [W + 60, 1650], [W + 60, 1680], [W + 60, 1700]], [760, 1500, W, 1200], 'rgba(150,210,110,.5)');
  ctx.filter = 'none';
  ctx.restore();
  // soft white haze center
  const hz = ctx.createRadialGradient(CX, H * .52, 50, CX, H * .52, 820);
  hz.addColorStop(0, 'rgba(250,253,247,.75)'); hz.addColorStop(1, 'rgba(250,253,247,0)');
  ctx.fillStyle = hz; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = BA * .9; ctx.drawImage(grid, Math.sin(t * .2) * 8, Math.cos(t * .17) * 8); ctx.globalAlpha = BA * 1;
}

// ---------- icons ----------
function igGradient(s) {
  const g = ctx.createRadialGradient(-s * .32, s * .62, 0, -s * .32, s * .62, s * 1.45);
  g.addColorStop(0, '#ffdc7a'); g.addColorStop(.18, '#fdb34b'); g.addColorStop(.36, '#f7743a');
  g.addColorStop(.52, '#e8336a'); g.addColorStop(.72, '#c1359a'); g.addColorStop(1, '#6b45d8');
  return g;
}
function igLinear(x0, y0, x1, y1) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, '#fdb34b'); g.addColorStop(.3, '#f7743a'); g.addColorStop(.55, '#e8336a'); g.addColorStop(.8, '#c1359a'); g.addColorStop(1, '#6b45d8');
  return g;
}
function igGlyph(s, col) {
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = s * .085;
  rr(-s * .3, -s * .3, s * .6, s * .6, s * .17); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, s * .14, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.arc(s * .175, -s * .175, s * .045, 0, 7); ctx.fill();
}
// glossy 3D app icon
function igIcon(x, y, s, rot = 0, alpha = 1, yaw = 0) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1 - Math.abs(yaw) * .25, 1);
  const r = s * .27, d = s * .1;
  shadow(s * .5, s * .22, .28, '120,30,70');
  for (let i = d; i > 0; i -= 2) {
    rr(-s / 2 + i * .35 * yaw, -s / 2 + i, s, s, r);
    ctx.fillStyle = i === d ? '#8d2a6c' : `rgb(${150 - i * 2},${40},${100 - i})`; ctx.fill(); if (i === d) noShadow();
  }
  rr(-s / 2, -s / 2, s, s, r); ctx.fillStyle = igGradient(s); ctx.fill();
  ctx.save(); rr(-s / 2, -s / 2, s, s, r); ctx.clip();
  const gl = ctx.createLinearGradient(0, -s / 2, 0, s * .1); gl.addColorStop(0, 'rgba(255,255,255,.42)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.ellipse(-s * .05, -s * .42, s * .62, s * .38, -.15, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = s * .025; rr(-s / 2 + s * .02, -s / 2 + s * .02, s - s * .04, s - s * .04, r * .95); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.translate(s * .012, s * .03); igGlyph(s, 'rgba(110,20,60,.35)'); ctx.restore();
  igGlyph(s, '#ffffff');
  ctx.restore();
}

// Meta infinity tube
function metaPts(R, n = 220) {
  const p = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n * Math.PI * 2;
    let x = Math.sin(t) * R, y = Math.sin(2 * t) * R * .52;
    if (x < 0) x *= .86;
    // slight lean so loops read like the mark
    x += y * .1;
    p.push([x, -y]);
  }
  return p;
}
function strokePts(pts, a, b) {
  ctx.beginPath(); ctx.moveTo(pts[a][0], pts[a][1]);
  for (let i = a + 1; i <= b; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
function metaLogo(x, y, R, draw = 1, alpha = 1) {
  const pts = metaPts(R), n = pts.length - 1, L = R * .2;
  const end = Math.floor(n * clamp(draw));
  if (end < 2) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const half = Math.floor(n / 2);
  const segs = [[0, Math.min(end, half)], [half, end]].filter(s => s[1] > s[0]);
  for (const [a, b] of segs) {
    shadow(L * 1.2, L * .5, .25, '10,50,140');
    ctx.strokeStyle = '#0a46b8'; ctx.lineWidth = L; ctx.save(); ctx.translate(0, L * .18); strokePts(pts, a, b); ctx.restore();
    noShadow();
    const g = ctx.createLinearGradient(-R, -R * .5, R, R * .5); g.addColorStop(0, '#0064e0'); g.addColorStop(.5, '#2b7cf6'); g.addColorStop(1, '#0082fb');
    ctx.strokeStyle = g; ctx.lineWidth = L * .92; strokePts(pts, a, b);
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = L * .22; ctx.save(); ctx.translate(-L * .1, -L * .2); strokePts(pts, a, b); ctx.restore();
  }
  ctx.restore();
}
function metaTile(x, y, s, rot, draw, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot);
  clay(-s / 2, -s / 2, s, s, s * .26, { depth: s * .06, top: '#ffffff', bot: '#eceff3', side: '#d2d7de', sa: .22, blur: s * .3, oy: s * .14 });
  metaLogo(0, 0, s * .34, draw);
  ctx.restore();
}

// Meta AI ring avatar
function aiRing(x, y, r, t, glow = 0) {
  ctx.save(); ctx.translate(x, y);
  if (glow > 0) { const g = ctx.createRadialGradient(0, 0, r * .5, 0, 0, r * 2.4); g.addColorStop(0, `rgba(80,110,255,${.35 * glow})`); g.addColorStop(1, 'rgba(80,110,255,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 2.4, 0, 7); ctx.fill(); }
  const cg = ctx.createConicGradient(t * 1.6, 0, 0);
  cg.addColorStop(0, '#0064e0'); cg.addColorStop(.25, '#7b4dff'); cg.addColorStop(.5, '#ff4fa3'); cg.addColorStop(.75, '#33c3ff'); cg.addColorStop(1, '#0064e0');
  ctx.strokeStyle = cg; ctx.lineWidth = r * .36; ctx.beginPath(); ctx.arc(0, 0, r * .78, 0, 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = r * .08; ctx.beginPath(); ctx.arc(0, 0, r * .86, Math.PI * 1.1, Math.PI * 1.6); ctx.stroke();
  ctx.restore();
}

function cursor(x, y, press = 0, alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); const s = 1.9 * (1 - press * .18); ctx.scale(s, s);
  shadow(16, 8, .3, '0,0,0');
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 34); ctx.lineTo(8.5, 26); ctx.lineTo(14, 38.5); ctx.lineTo(19.5, 36); ctx.lineTo(14, 24); ctx.lineTo(25, 24); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill(); noShadow(); ctx.strokeStyle = '#111'; ctx.lineWidth = 2.4; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
}
function ripple(x, y, p, col = '255,255,255') {
  if (p <= 0 || p >= 1) return;
  ctx.save(); ctx.strokeStyle = `rgba(${col},${(1 - p) * .9})`; ctx.lineWidth = 10 * (1 - p) + 2;
  ctx.beginPath(); ctx.arc(x, y, 20 + p * 90, 0, 7); ctx.stroke();
  ctx.fillStyle = `rgba(${col},${(1 - p) * .25})`; ctx.beginPath(); ctx.arc(x, y, 20 + p * 60, 0, 7); ctx.fill(); ctx.restore();
}
function sparkle(x, y, s, a = 1, col = '#ffffff') {
  if (a <= 0 || s <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.fillStyle = col;
  shadow(s * 1.5, 0, .6, '255,255,255');
  ctx.beginPath(); ctx.moveTo(0, -s);
  ctx.quadraticCurveTo(s * .12, -s * .12, s, 0); ctx.quadraticCurveTo(s * .12, s * .12, 0, s);
  ctx.quadraticCurveTo(-s * .12, s * .12, -s, 0); ctx.quadraticCurveTo(-s * .12, -s * .12, 0, -s); ctx.fill();
  ctx.restore();
}
function heart(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 40, s / 40); ctx.beginPath();
  ctx.moveTo(0, 14); ctx.bezierCurveTo(-30, -6, -18, -32, 0, -16); ctx.bezierCurveTo(18, -32, 30, -6, 0, 14);
  ctx.fillStyle = col; ctx.fill(); ctx.restore();
}
function eyeIcon(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = s * .12;
  ctx.beginPath(); ctx.moveTo(-s, 0); ctx.quadraticCurveTo(0, -s * .95, s, 0); ctx.quadraticCurveTo(0, s * .95, -s, 0); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, s * .32, 0, 7); ctx.fill(); ctx.restore();
}
function playTri(x, y, s, col = '#fff') { ctx.save(); ctx.translate(x, y); ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-s * .4, -s * .5); ctx.lineTo(s * .55, 0); ctx.lineTo(-s * .4, s * .5); ctx.closePath(); ctx.lineJoin = 'round'; ctx.lineWidth = s * .2; ctx.strokeStyle = col; ctx.stroke(); ctx.fill(); ctx.restore(); }
function planeIcon(x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-.35); ctx.strokeStyle = col; ctx.lineWidth = s * .13; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-s, -s * .15); ctx.lineTo(s, -s * .6); ctx.lineTo(s * .1, s * .9); ctx.lineTo(-s * .2, s * .05); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-s * .2, s * .05); ctx.lineTo(s, -s * .6); ctx.stroke(); ctx.restore();
}
function searchIcon(x, y, s, col) { ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = s * .2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(x - s * .15, y - s * .15, s * .5, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x + s * .22, y + s * .22); ctx.lineTo(x + s * .6, y + s * .6); ctx.stroke(); ctx.restore(); }
function check(x, y, s, p, col = '#fff') { if (p <= 0) return; ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = s * .22; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); const a = [x - s * .45, y], b = [x - s * .1, y + s * .35], c = [x + s * .5, y - s * .35]; ctx.moveTo(...a); const p1 = clamp(p * 2), p2 = clamp(p * 2 - 1); ctx.lineTo(lerp(a[0], b[0], p1), lerp(a[1], b[1], p1)); if (p2 > 0) ctx.lineTo(lerp(b[0], c[0], p2), lerp(b[1], c[1], p2)); ctx.stroke(); ctx.restore(); }
function personPlus(x, y, s, col) { ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = s * .14; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(x - s * .2, y - s * .3, s * .3, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(x - s * .2, y + s * .65, s * .55, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x + s * .55, y - s * .3); ctx.lineTo(x + s * .55, y + s * .2); ctx.moveTo(x + s * .3, y - s * .05); ctx.lineTo(x + s * .8, y - s * .05); ctx.stroke(); ctx.restore(); }
function bubbleIcon(x, y, s, col) { ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = s * .14; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.arc(x, y, s * .6, Math.PI * .75, Math.PI * 2.55); ctx.lineTo(x - s * .7, y + s * .7); ctx.closePath(); ctx.stroke(); ctx.restore(); }

function avatarCircle(x, y, r, ring = 'ig', ringP = 1, sat = 1) {
  ctx.save();
  if (ring) {
    ctx.lineWidth = r * .1;
    ctx.strokeStyle = ring === 'ig' ? igLinear(x - r, y + r, x + r, y - r) : '#cfd5cc';
    ctx.beginPath(); ctx.arc(x, y, r * 1.12, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ringP); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r * .93, 0, 7); ctx.clip();
  if (AVATAR) { ctx.filter = sat < 1 ? `saturate(${sat}) brightness(${.9 + sat * .1})` : 'none'; const k = r * .93 / .8; ctx.drawImage(AVATAR, x - k, y - k, k * 2, k * 2); ctx.filter = 'none'; }
  ctx.restore();
}

// abstract thumbnail fill
const THUMBS = [['#ff9a5a', '#e8336a'], ['#7b6cff', '#33c3ff'], ['#5ccf7a', '#1f9e6a'], ['#ffd36e', '#f7743a'], ['#c1359a', '#6b45d8'], ['#2b7cf6', '#7b4dff'], ['#ff6f91', '#ffc36e'], ['#35d0c0', '#2b7cf6'], ['#f7743a', '#c1359a']];
function thumb(x, y, w, h, r, k, grey = 0) {
  const c = THUMBS[k % THUMBS.length];
  const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, c[0]); g.addColorStop(1, c[1]);
  rr(x, y, w, h, r); ctx.fillStyle = g; ctx.fill();
  ctx.save(); rr(x, y, w, h, r); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.arc(x + w * .78, y + h * .22, w * .35, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.beginPath(); ctx.ellipse(x + w * .3, y + h * 1.02, w * .7, h * .38, 0, 0, 7); ctx.fill();
  if (grey > 0) { ctx.fillStyle = `rgba(214,220,210,${grey})`; ctx.fillRect(x, y, w, h); }
  ctx.restore();
}

// phone frame
function phone(x, y, w, h, content) {
  clay(x - 14, y - 14, w + 28, h + 28, 78, { depth: 18, top: '#fdfdfb', bot: '#e9eee6', side: '#cfd6ca', sa: .24, blur: 90, oy: 50 });
  rr(x, y, w, h, 64); ctx.fillStyle = '#fbfcfa'; ctx.fill();
  ctx.save(); rr(x, y, w, h, 64); ctx.clip(); content(x, y, w, h); ctx.restore();
  // island
  rr(x + w / 2 - 70, y + 22, 140, 38, 19); ctx.fillStyle = '#1d211c'; ctx.fill();
}

// ---------- scenes ----------
// S1 0-5 : posting consistently, views stuck
function S1(t) {
  const ip = spring(prog(t, 0.05, 1.3) * 2.2, 3.2, 4.2);
  const iy = lerp(H + 300, 560, ip) + Math.sin(t * 1.6) * 10;
  const rot = lerp(.9, -.12, ip) + Math.sin(t * 1.2) * .03;
  // reel cards
  const cards = [[-300, -.14], [0, 0], [300, .14]];
  cards.forEach(([dx, r], i) => {
    const p = eBack(prog(t, 1.0 + i * .22, 1.55 + i * .22));
    if (p <= 0) return;
    const x = CX + dx * p, y = 1130 + Math.abs(dx) * .12 + Math.sin(t * 1.4 + i) * 8, cw = 250, ch = 420;
    ctx.save(); ctx.translate(x, y); ctx.rotate(r * p); ctx.scale(lerp(.6, 1, p), lerp(.6, 1, p)); ctx.globalAlpha = BA * clamp(p * 2);
    clay(-cw / 2 - 12, -ch / 2 - 12, cw + 24, ch + 24, 40, { depth: 10 });
    const dull = prog(t, 3.2, 4.2);
    thumb(-cw / 2, -ch / 2, cw, ch, 30, i * 3 + 1, dull * .55);
    playTri(0, -30, 50, 'rgba(255,255,255,.9)');
    // view meter that stalls
    const fill = .16 * eOut(prog(t, 1.7 + i * .2, 2.6 + i * .2)) + Math.sin(t * 8 + i) * .004 * prog(t, 2.6, 3);
    eyeIcon(-cw / 2 + 40, ch / 2 - 44, 15, '#fff');
    bar(-cw / 2 + 70, ch / 2 - 52, cw - 100, 16, 'rgba(255,255,255,.35)');

// S7 29.5-35 : follow + comment end card
function S7(t) {
  const lt = t - 29.5;
  const ap = spring(prog(lt, .05, 1.1) * 2.2, 3, 4.5);
  const ax = CX, ay = 560;

  const pr2 = 1 - Math.sin(clamp((lt - cClick + .1) / .25) * Math.PI) * .07;
  if (b1 > 0) {
    ctx.save(); ctx.translate(fx + bw / 2, by + bh / 2); ctx.scale(b1 * pr1, b1 * pr1);
    shadow(40, 20, .3, '200,40,90');
    rr(-bw / 2, -bh / 2 + 10, bw, bh, bh / 2); ctx.fillStyle = '#9b2a6a'; ctx.fill(); noShadow();
    rr(-bw / 2, -bh / 2, bw, bh, bh / 2); ctx.fillStyle = igLinear(-bw / 2, bh / 2, bw / 2, -bh / 2); ctx.fill();
    ctx.save(); rr(-bw / 2, -bh / 2, bw, bh, bh / 2); ctx.clip(); const gl = ctx.createLinearGradient(0, -bh / 2, 0, 0); gl.addColorStop(0, 'rgba(255,255,255,.4)'); gl.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = gl; ctx.fillRect(-bw / 2, -bh / 2, bw, bh / 2); ctx.restore();
    ctx.fillStyle = '#fff'; ctx.font = `800 54px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    else { ctx.globalAlpha = BA * (fDone * 2 - 1); ctx.beginPath(); ctx.arc(-115, 2, 30, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fill(); check(-115, 2, 30, prog(lt, fClick + .1, fClick + .4)); ctx.fillStyle = '#fff'; ctx.fillText('Following', 40, 4); }
    ctx.restore();

  if (b2 > 0) {
    ctx.save(); ctx.translate(mx + bw / 2, by + bh / 2); ctx.scale(b2 * pr2, b2 * pr2);

    ctx.fillStyle = '#1b1f1a'; ctx.font = `800 54px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  // heart burst on follow
  const hb = prog(lt, fClick, fClick + 1.0);

    ctx.fillStyle = '#9db4e6'; ctx.beginPath(); ctx.arc(cx1 + 105, cy1 + 98, 24, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(cx1 + 105, cy1 + 160, 42, Math.PI, 0); ctx.fill();

  if (lt < fClick) cp = mv(c0, c1, 1.3, fClick - .1); else if (lt < cClick) cp = mv(c1, c2, fClick + .3, cClick - .1); else cp = mv(c2, c3, cClick + 1.2, cClick + 1.9);

  if (sp2 > 0) { const r4 = rand(21); for (let k = 0; k < 8; k++) { const q = prog(sp2, r4() * .5, r4() * .5 + .5); sparkle(120 + r4() * 840, 300 + r4() * 1400, 28 * Math.sin(q * Math.PI), 1, '#ffffff'); } }

const SCENES = [[S1, 0, 5], [S2, 5, 10], [S3, 10, 15], [S4, 15, 20], [S5, 20, 25], [S6, 25, 29.5], [S7, 29.5, 35]];
const XF = .38; // crossfade length

const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
const lctx = layer.getContext('2d');
window.renderFrame = function (t) {
  BA = 1; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; noShadow();
  background(t);
  const main = ctx;
  for (const [fn, a, b] of SCENES) {
    const isLast = b === 35, isFirst = a === 0;
    if (t < a - .01 || (!isLast && t > b + XF)) continue;
    const inP = isFirst ? 1 : eOut(prog(t, a, a + XF));
    const outP = isLast ? 0 : eInOut(prog(t, b, b + XF));
    const alpha = Math.min(inP, 1 - outP);
    if (alpha <= 0.001) continue;
    // draw scene at full opacity into its own layer, then composite
    lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.globalAlpha = 1; lctx.clearRect(0, 0, W, H);
    ctx = lctx; noShadow(); fn(t); noShadow(); ctx = main;
    ctx.save();
    ctx.globalAlpha = alpha;
    const s = lerp(.94, 1, inP) * lerp(1, 1.1, outP);
    ctx.translate(CX, H / 2); ctx.scale(s, s); ctx.translate(-CX, -H / 2 - outP * 120);
    if (outP > 0) ctx.filter = `blur(${outP * 14}px)`;
    ctx.drawImage(layer, 0, 0);
    ctx.restore();
  }
};
window.renderFrame(0);
