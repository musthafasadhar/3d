<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IT;src:url(../assets/InterTight.ttf);font-weight:100 900}
@font-face{font-family:Jakarta;src:url(../assets/InterTight.ttf);font-weight:100 900}
@font-face{font-family:News;src:url(../assets/Newsreader.ttf);font-weight:200 800}
@font-face{font-family:NewsI;src:url(../assets/Newsreader-Italic.ttf);font-weight:200 800}
:root{--cream:#FAF9E8;--green:#244B37;--ink:#233E32;--gold:#F0D682;--outline:#0E2519}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
.layer{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden}
*{box-sizing:border-box}
/* ---------- captions ---------- */
.cap{position:absolute;left:0;width:1080px;display:flex;justify-content:center;transform:translateY(-50%)}
.blk{display:inline-flex;flex-direction:column;align-items:stretch;max-width:980px}
.lead,.sub{font-family:IT;font-weight:800;font-size:56px;line-height:1;letter-spacing:-.04em;white-space:nowrap;color:#fff;filter:drop-shadow(0 3px 10px rgba(0,0,0,.55))}
.lead{text-align:left;padding-left:10px;margin-bottom:-14px;position:relative;z-index:2}
.sub{text-align:right;padding-right:10px;margin-top:-6px}
.big{font-family:IT;font-weight:800;line-height:1.0;letter-spacing:-.035em;filter:drop-shadow(0 6px 16px rgba(0,0,0,.55)) drop-shadow(0 0 34px rgba(0,0,0,.38));white-space:nowrap;position:relative;text-align:center}
.w{position:relative;display:inline-block;margin-right:.24em;will-change:transform,opacity,filter}
.w:last-child{margin-right:0}
.w .s{visibility:hidden}
.w .f{position:absolute;left:0;top:0;color:#fff}

.big .w .f{background:linear-gradient(180deg,#F4FF86 0%,#E2FC52 42%,#C3EE2E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.strike{position:absolute;left:-5%;width:110%;top:61%;height:16px;border-radius:9px;background:linear-gradient(90deg,#FF6B6E,#E5383B);
  box-shadow:0 6px 16px rgba(0,0,0,.35);transform-origin:left center}
.star{position:absolute;width:74px;height:58px;right:-46px;top:-30px;background:url(../assets/star.png) center/contain no-repeat;filter:drop-shadow(0 0 10px rgba(255,255,255,.8)) drop-shadow(0 4px 8px rgba(0,0,0,.4))}
/* behind-the-head hook text */

/* ---------- feature pills ---------- */
#pills{position:absolute;left:0;width:1080px}
.pill{position:absolute;left:170px;width:740px;height:98px;border-radius:30px;display:flex;align-items:center;gap:22px;padding:0 26px 0 18px;
  background:linear-gradient(95deg,rgba(12,22,17,.90) 0%,rgba(24,58,40,.90) 55%,rgba(52,104,62,.88) 100%);border:none;
  box-shadow:0 14px 34px rgba(0,0,0,.38);color:#fff;font-family:IT;font-weight:600;font-size:42px;letter-spacing:-.025em}
.pill .ic{width:64px;height:64px;border-radius:20px;flex:none;display:grid;place-items:center;background:linear-gradient(160deg,#F4FF86,#C3EE2E)}
.pill .ic svg{width:36px;height:36px;stroke:#173A28;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pill .tx{flex:1;white-space:nowrap}
.pill .ok{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(214,250,80,.2)}
.pill .ok svg{width:24px;height:24px;stroke:#DDFB4E;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* ---------- b-roll ---------- */
#broll{position:absolute;inset:0;overflow:hidden;background:var(--cream)}
#broll .bg{position:absolute;inset:0;background:
  radial-gradient(900px 700px at 50% 8%,rgba(240,214,130,.55),transparent 70%),
  radial-gradient(800px 800px at 10% 95%,rgba(196,214,170,.55),transparent 70%),
  radial-gradient(700px 700px at 95% 70%,rgba(227,224,238,.7),transparent 70%),var(--cream)}
#stage{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 22%}
#win{position:absolute;left:540px;top:0;width:1440px;overflow:hidden;background:#fff;transform-origin:50% 0%;
  box-shadow:0 40px 120px rgba(35,62,50,.28),0 0 0 1px rgba(35,62,50,.08)}
#page{position:absolute;left:0;top:0;width:1440px;display:block}
.chip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:14px;padding:16px 28px 16px 16px;border-radius:26px;
  font-family:Jakarta;font-weight:700;font-size:34px;color:var(--ink);box-shadow:0 18px 40px rgba(35,62,50,.22),inset 0 1px 0 rgba(255,255,255,.7);white-space:nowrap}
.chip .ci{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.75);display:grid;place-items:center}
.chip svg{width:30px;height:30px;stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
#tag{position:absolute;left:50%;top:250px;display:flex;align-items:center;gap:14px;padding:14px 30px 14px 16px;border-radius:999px;background:#fff;
  box-shadow:0 12px 32px rgba(35,62,50,.18);font-family:Jakarta;font-weight:700;font-size:32px;color:var(--ink);white-space:nowrap}
#tag .dot{width:46px;height:46px;border-radius:50%;background:var(--green) url(../assets/star.png) center/30px no-repeat}
#tag .dot{background-blend-mode:normal}
#t1,#t2{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap}
#t1{top:340px;font-family:IT;font-weight:800;font-size:96px;letter-spacing:-.045em;line-height:1.05}
#t1 span{background:linear-gradient(180deg,#3C7A57,#173A28);-webkit-background-clip:text;background-clip:text;color:transparent}
#t2{top:452px;font-family:IT;font-weight:600;font-size:80px;letter-spacing:-.04em;color:#3E6B4F;line-height:1.05}
#t2 .ul{position:absolute;left:50%;bottom:-14px;width:560px;height:30px;transform:translateX(-50%)}
/* ---------- end card ---------- */
#endbg{position:absolute;inset:0;background:
  radial-gradient(900px 600px at 50% 0%,rgba(240,214,130,.6),transparent 70%),
  radial-gradient(900px 800px at 0% 100%,rgba(196,214,170,.6),transparent 70%),
  radial-gradient(700px 700px at 100% 60%,rgba(241,221,208,.7),transparent 70%),var(--cream)}
#elogo{position:absolute;left:50%;top:96px;width:360px;transform:translateX(-50%)}
#e1,#e2{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;line-height:1.05}
#e1{top:228px;font-family:IT;font-weight:700;font-size:84px;color:var(--ink);letter-spacing:-.045em}
#e2{top:322px;font-family:IT;font-weight:800;font-size:92px;letter-spacing:-.045em}
#e2 span{background:linear-gradient(90deg,#1F4D36 0%,#3F8A5C 45%,#C8962E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#cardring{position:absolute;background:#fff;box-shadow:0 34px 90px rgba(35,62,50,.38)}
#cta{position:absolute;left:50%;display:flex;align-items:center;gap:18px;padding:22px 40px;border-radius:999px;background:var(--green);color:var(--cream);
  font-family:Jakarta;font-weight:750;font-size:38px;white-space:nowrap;box-shadow:0 16px 36px rgba(36,75,55,.35)}
#cta svg{width:34px;height:34px;stroke:var(--gold);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
#cta .url{color:var(--gold)}

/* ---------- calling cards ---------- */
.call{position:absolute;width:470px;height:104px;border-radius:30px;display:flex;align-items:center;gap:18px;padding:0 22px 0 16px;
  background:rgba(250,250,247,.94);box-shadow:0 16px 40px rgba(0,0,0,.35);font-family:IT;color:#1d2a22}
.call .av{position:relative;width:70px;height:70px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(160deg,#3d8c5e,#1d4a33)}
.call .av svg{width:34px;height:34px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.call .ring{position:absolute;inset:-8px;border-radius:50%;border:3px solid rgba(61,140,94,.55)}
.call .k{font-size:26px;font-weight:600;color:#6b766f;letter-spacing:-.02em;line-height:1.1}
.call .d{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.call .end{margin-left:auto;width:56px;height:56px;border-radius:50%;background:#E5484D;display:grid;place-items:center}
.call .end svg{width:28px;height:28px;stroke:#fff;stroke-width:2.4;fill:none;transform:rotate(135deg)}
/* ---------- dashboard b-roll ---------- */
#dash{position:absolute;inset:0;overflow:hidden;background:var(--cream)}
#dash .bg{position:absolute;inset:0;background:radial-gradient(900px 700px at 50% 0%,rgba(214,250,80,.28),transparent 70%),radial-gradient(800px 800px at 0% 100%,rgba(196,214,170,.6),transparent 70%),radial-gradient(700px 700px at 100% 60%,rgba(227,224,238,.8),transparent 70%),var(--cream)}
#dlead{position:absolute;left:0;width:1080px;top:250px;text-align:center;font-family:IT;font-weight:800;font-size:58px;letter-spacing:-.04em;color:var(--ink)}
#dbig{position:absolute;left:0;width:1080px;top:300px;text-align:center;font-family:IT;font-weight:800;font-size:190px;letter-spacing:-.045em;line-height:1.05}
#dbig span{background:linear-gradient(180deg,#58B07A 0%,#2E7350 50%,#1B4A33 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 22px rgba(35,62,50,.22))}
#dcard{position:absolute;left:70px;top:600px;width:940px;height:930px;border-radius:46px;background:#fff;box-shadow:0 40px 100px rgba(35,62,50,.25);padding:40px;font-family:IT;color:var(--ink)}
#dcard .hd{display:flex;align-items:center;gap:16px;font-weight:800;font-size:38px;letter-spacing:-.035em}
#dcard .hd .dot{width:52px;height:52px;border-radius:16px;background:var(--green) url(../assets/star.png) center/32px no-repeat}
#dcard .hd .tm{margin-left:auto;font-weight:600;font-size:26px;color:#7b857e;letter-spacing:-.02em}
#dcard .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:30px}
.kpi{height:236px;border-radius:30px;padding:26px 28px;position:relative}
.kpi .lb{font-weight:700;font-size:28px;letter-spacing:-.03em;color:#4a5a50;display:flex;align-items:center;gap:10px}
.kpi .lb svg{width:28px;height:28px;stroke:#4a5a50;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.kpi .v{font-weight:800;font-size:92px;letter-spacing:-.055em;line-height:1;margin-top:22px;color:var(--ink)}
.kpi .sm{font-weight:600;font-size:24px;color:#6b766f;letter-spacing:-.02em;margin-top:8px}
.kpi .rg{position:absolute;right:24px;bottom:24px;width:120px;height:120px}
.chart{margin-top:22px;height:250px;border-radius:30px;background:#F6F8F0;padding:24px 28px;position:relative}
.chart svg.cv{position:absolute;left:28px;right:28px;bottom:20px;width:824px;height:160px}
#dnote{position:absolute;left:0;width:1080px;top:1560px;text-align:center;font-family:IT;font-weight:600;font-size:24px;color:#8a938c;letter-spacing:.02em}

/* ---------- motion-graphics scenes (first 10 s) ---------- */
#mg{position:absolute;inset:0;overflow:hidden}
.scn{position:absolute;inset:0;overflow:hidden;display:none}
.scn.white{background:radial-gradient(1200px 900px at 30% 10%,#ffffff,#F1F2EC 60%,#E6E8DF 100%)}
.scn.green{background:radial-gradient(1000px 900px at 50% 30%,#245A3E,#163828 55%,#0D2419 100%)}
.scn .grid{position:absolute;inset:-40px;background-image:linear-gradient(rgba(35,62,50,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(35,62,50,.06) 2px,transparent 2px);background-size:90px 90px}
.scn.green .grid{background-image:linear-gradient(rgba(214,250,80,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(214,250,80,.06) 2px,transparent 2px)}
.scn .sweep{position:absolute;left:-60%;top:-20%;width:60%;height:140%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
.scn.green .sweep{background:linear-gradient(90deg,transparent,rgba(214,250,80,.10),transparent)}
.scn .ghost{position:absolute;left:0;width:1080px;top:1500px;text-align:center;font-family:IT;font-weight:900;font-size:330px;letter-spacing:-.06em;color:rgba(35,62,50,.05);white-space:nowrap}
.scn.green .ghost{color:rgba(214,250,80,.06)}
.scn .in{position:absolute;inset:0}
.scn .ld{position:absolute;left:0;width:1080px;top:300px;text-align:center;font-family:IT;font-weight:800;font-size:60px;letter-spacing:-.04em;color:#233E32}
.scn.green .ld{color:#fff}
.scn .ld .hl{display:inline-block;padding:2px 18px 6px;border-radius:12px;background:#D7FA4E;color:#163828;margin-left:10px}
.scn.green .ld .hl{background:#fff}
.scn .bg2{position:absolute;left:0;width:1080px;top:370px;text-align:center;font-family:IT;font-weight:800;font-size:150px;letter-spacing:-.045em;line-height:1.02;white-space:nowrap}
.scn .bg2 span{display:inline-block}
.scn.white .bg2 span{background:linear-gradient(180deg,#5DB884 0%,#2E7350 52%,#173F2B 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 22px rgba(35,62,50,.18))}
.scn.green .bg2 span{background:linear-gradient(180deg,#F4FF86 0%,#E2FC52 42%,#C3EE2E 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 30px rgba(0,0,0,.35))}
/* students */
.av{position:absolute;width:130px;height:130px;border-radius:40px;background:#fff;box-shadow:0 10px 26px rgba(35,62,50,.14);display:grid;place-items:center}
.av svg{width:64px;height:64px;stroke:#9aa59e;stroke-width:2;fill:none;stroke-linecap:round}
.av.on{background:linear-gradient(160deg,#3d8c5e,#1d4a33)}
.av.on svg{stroke:#fff}
.av .ck{position:absolute;right:-10px;top:-10px;width:48px;height:48px;border-radius:50%;background:#D7FA4E;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.18)}
.av .ck svg{width:28px;height:28px;stroke:#163828;stroke-width:3.4}
.cnt{position:absolute;left:0;width:1080px;top:1560px;text-align:center;font-family:IT;font-weight:800;font-size:96px;letter-spacing:-.05em;color:#233E32}
.cnt small{font-size:44px;font-weight:700;color:#6b766f;letter-spacing:-.03em}
/* fees */
.coin{position:absolute;left:540px;top:930px;width:400px;height:400px;margin:-200px 0 0 -200px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFF6B8,#F5D45A 45%,#D9A12E 80%,#B9821F);box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 -14px 0 rgba(0,0,0,.12),inset 0 10px 0 rgba(255,255,255,.35);
  display:grid;place-items:center;font-family:IT;font-weight:900;font-size:240px;color:#8A5A12}
.coin .rim{position:absolute;inset:22px;border-radius:50%;box-shadow:inset 0 0 0 6px rgba(138,90,18,.25)}
.bar{position:absolute;left:150px;top:1290px;width:780px;height:44px;border-radius:22px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:22px;background:linear-gradient(90deg,#C3EE2E,#F4FF86)}
.barl{position:absolute;left:0;width:1080px;top:1360px;text-align:center;font-family:IT;font-weight:700;font-size:52px;letter-spacing:-.03em;color:#fff}
.barl b{color:#E2FC52}
/* academic */
.chartbox{position:absolute;left:110px;top:760px;width:860px;height:760px;border-radius:50px;background:#fff;box-shadow:0 30px 70px rgba(35,62,50,.16)}
.cb{position:absolute;bottom:70px;width:92px;border-radius:22px 22px 10px 10px;background:linear-gradient(180deg,#5DB884,#245A3E)}
.cb.hi{background:linear-gradient(180deg,#E2FC52,#9CCB1E)}
.badge{position:absolute;right:-30px;top:-60px;width:200px;height:200px;border-radius:50%;background:#D7FA4E;display:grid;place-items:center;font-family:IT;font-weight:900;font-size:96px;color:#163828;letter-spacing:-.05em;box-shadow:0 20px 40px rgba(35,62,50,.25)}
/* admission */
.form{position:absolute;left:220px;top:720px;width:640px;height:820px;border-radius:40px;background:#FAF9F2;box-shadow:0 40px 80px rgba(0,0,0,.4);padding:56px;font-family:IT}
.form .ph{width:150px;height:150px;border-radius:50%;background:linear-gradient(160deg,#DEE6CC,#B8C9A0)}
.form .ln{height:26px;border-radius:13px;background:#E3E5DC;margin-top:30px}
.form .tt{font-weight:800;font-size:50px;letter-spacing:-.04em;color:#233E32;margin-top:36px}
.stamp{position:absolute;left:540px;top:1260px;padding:20px 44px;border-radius:24px;border:10px solid #2E8A4E;color:#2E8A4E;font-family:IT;font-weight:900;font-size:118px;letter-spacing:-.02em;background:rgba(215,250,78,.25);white-space:nowrap}
/* parents */
.bub{position:absolute;left:70px;max-width:760px;display:flex;align-items:flex-end;gap:20px;font-family:IT}
.bub .pa{width:104px;height:104px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:40px;color:#fff}
.bub .tx{padding:30px 40px;border-radius:44px 44px 44px 12px;background:#fff;box-shadow:0 14px 34px rgba(35,62,50,.14);font-weight:700;font-size:56px;letter-spacing:-.03em;color:#233E32;white-space:nowrap}
.res{position:absolute;left:540px;top:1500px;padding:26px 48px;border-radius:999px;background:linear-gradient(160deg,#3d8c5e,#1d4a33);color:#fff;font-family:IT;font-weight:800;font-size:56px;letter-spacing:-.035em;display:flex;align-items:center;gap:18px;white-space:nowrap;box-shadow:0 20px 40px rgba(29,74,51,.35)}
.res svg{width:48px;height:48px;stroke:#D7FA4E;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body>
<div class="layer" id="L_under"></div>
<div class="layer" id="L_behind"></div>
<div class="layer" id="L_over"></div>
<script>
const ICONS={
 users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 4.6a3 3 0 0 1 0 6"/><path d="M18 13.8c2 .6 3 2.4 3 5.2"/>',
 rupee:'<path d="M6 4h12M6 9h12M9 4c4 0 6 1.5 6 5s-3 5-6 5H6l8 7"/>',
 chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/>',
 cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
 bus:'<rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 10h16M8 21v-4M16 21v-4"/>',
 library:'<path d="M5 4v16M10 4v16M15 5l4 15"/>',
 arrow:'<path d="M7 17L17 7M9 7h8v8"/>'};
const svg=(k)=>`<svg viewBox="0 0 24 24">${ICONS[k]}</svg>`;
const cl=(x)=>Math.min(1,Math.max(0,x));
const eOut=(x)=>1-Math.pow(1-cl(x),3);
const eOutQ=(x)=>1-Math.pow(1-cl(x),5);
const eIO=(x)=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eBack=(x)=>{x=cl(x);const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;
let TL=null, CAPS=[], PILLS=[], B={}, E={};

function mkWord(txt,big){const w=document.createElement('span');w.className='w';
  w.innerHTML=`<span class="s">${txt}</span><span class="f">${txt}</span>`;return w}

function buildCaps(){
  for(const c of TL.caps){
    const host=document.getElementById(c.behind?'L_behind':'L_over');
    const el=document.createElement('div');el.className='cap'+(c.behind?' behind':'');el.style.top=c.y+'px';
    const blk=document.createElement('div');blk.className='blk';el.appendChild(blk);
    const words=[];
    for(const part of ['lead','big','sub']){
      const arr=c[part]||[]; if(!arr.length) continue;
      const line=document.createElement('div');line.className=part;blk.appendChild(line);
      for(const [txt,t] of arr){const w=mkWord(txt);line.appendChild(w);words.push({el:w,t,big:part==='big'})}
      if(part==='big'){
        if(c.strike!=null){const s=document.createElement('div');s.className='strike';line.appendChild(s);c._strike=s}
        if(c.star!=null){const s=document.createElement('div');s.className='star';line.appendChild(s);c._star=s}
        c._big=line;
      }
    }
    host.appendChild(el);
    // fit big line
    if(c._big){let fs=c.behind?190:168;c._big.style.fontSize=fs+'px';
      const maxW=c.behind?1010:930;
      while(c._big.scrollWidth>maxW&&fs>60){fs-=2;c._big.style.fontSize=fs+'px'}}
    c._el=el;c._words=words;CAPS.push(c);
  }
}
function renderCaps(t){
  for(const c of CAPS){
    const vis=t>=c.start-0.001&&t<c.end;
    c._el.style.display=vis?'flex':'none'; if(!vis) continue;
    const q=cl((t-(c.end-0.16))/0.16);

function renderBroll(t){

    if(sc.kind==='students'){const av=[...el.querySelectorAll('.av')];av.forEach((a,k)=>{const ap=eBack((tau-0.05-k*0.012)/0.3);a.style.transform=`scale(${Math.max(0,ap)})`;
        const on=t>=k0+k*0.045&&k!==7&&k!==13;a.classList.toggle('on',on);const ck=a.querySelector('.ck');const cp=eBack((t-(k0+k*0.045))/0.22);ck.style.transform=`scale(${on?Math.max(0,cp):0})`});
      const c=eOut((t-k0)/1.0);el.querySelector('.cnt .n').textContent=Math.round(482*c);el.querySelector('.cnt').style.opacity=cl((tau-0.1)/0.2)}
    if(sc.kind==='fees'){const coin=el.querySelector('.coin');const d=(t-(sc.big-0.05))/0.33;const e=eBack(d);const ang=(1-eOut((t-sc.big)/0.6))*Math.PI*5;
      coin.style.transform=`translateY(${-500*(1-cl(e))}px) scaleX(${Math.max(0.06,Math.abs(Math.cos(ang)))}) scale(${0.7+0.3*cl(e)})`;coin.style.opacity=cl(d*3);
      const f=eOut((t-sc.big-0.2)/0.7);el.querySelector('.bar i').style.width=(92*f)+'%';el.querySelector('.barl .n').textContent='₹'+(8.2*f).toFixed(1)+'L';el.querySelector('.barl .p').textContent=Math.round(92*f);
      el.querySelector('.barl').style.opacity=cl((t-sc.big-0.1)/0.2)}
    if(sc.kind==='academic'){const cb=[...el.querySelectorAll('.cb')];cb.forEach((c,k)=>{const g=eBack((t-(k0+k*0.08))/0.35);c.style.transform=`scaleY(${Math.max(0,g)})`;c.style.transformOrigin='bottom'});
      const tr=el.querySelector('.tr');const L=tr.getTotalLength();tr.style.strokeDasharray=L;tr.style.strokeDashoffset=L*(1-eIO((t-k0-0.25)/0.5));
      const bd=el.querySelector('.badge');const bp=eBack((t-k0-0.6)/0.35);bd.style.transform=`scale(${Math.max(0,bp)}) rotate(${(1-cl(bp))*-30}deg)`;
      el.querySelector('.chartbox').style.transform=`translateY(${60*(1-eOut(tau/0.3))}px)`}
    if(sc.kind==='admission'){const fm=el.querySelector('.form');const fp=eOut((tau)/0.3);fm.style.transform=`translateY(${120*(1-fp)}px) rotate(-3deg)`;
      const st=el.querySelector('.stamp');const sp=(t-(sc.big+0.3)+0.12)/0.12;const se=cl(sp);st.style.opacity=se;st.style.transform=`translate(-50%,0) rotate(-12deg) scale(${2.4-1.4*eOut(se)})`}
    if(sc.kind==='parents'){[...el.querySelectorAll('.bub')].forEach((b,k)=>{const p=eBack((t-(sc.big+0.05+k*0.22))/0.3);b.style.transform=`scale(${Math.max(0,p)})`;b.style.transformOrigin='left bottom';b.style.opacity=cl(p*2)});
      const r=el.querySelector('.res');const rp=eBack((t-(sc.big+0.72))/0.3);r.style.transform=`translateX(-50%) scale(${Math.max(0,rp)})`}
  }}

window.init=async(tl)=>{TL=tl;window.__fitMG=()=>{MG.forEach(m=>{const b=m.el.querySelector('.bg2'),sp=b.querySelector('span');let fs=150;b.style.fontSize=fs+'px';m.el.style.display='block';while(sp.offsetWidth>980&&fs>70){fs-=2;b.style.fontSize=fs+'px'}m.el.style.display='none'});};buildCaps();buildPills();buildBroll();buildEnd();buildCalls();buildDash();buildMG();await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
  window.__fitMG();
  // refit big lines after fonts load
  for(const c of CAPS){if(c._big){let fs=c.behind?190:168;c._big.style.fontSize=fs+'px';const maxW=c.behind?1010:930;while(c._big.scrollWidth>maxW&&fs>60){fs-=2;c._big.style.fontSize=fs+'px'}}}
  return true};
window.render=(i,layer,sub)=>{const fr=TL.frames[Math.min(i,TL.frames.length-1)];const t=fr.t+(sub||0)/TL.fps;
  for(const L of ['under','behind','over'])document.getElementById('L_'+L).style.display=(L===layer)?'block':'none';
  if(layer==='over'){renderCaps(t);renderPills(t);renderCalls(t);renderBroll(t);renderDash(t);renderMG(t)}
  else if(layer==='behind'){renderCaps(t)}
  else if(layer==='under'){renderEnd(t,fr)}
  return true};
</script></body></html>
